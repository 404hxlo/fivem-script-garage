m>inside one script on one machine\u003c/em>.\u003c/li>\u003cli>A \u003cstrong>network ID\u003c/strong> is shared. It is a 16-bit number that stays the same for the entity's whole life and means the same thing on every client and the server.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Rule:\u003c/strong> whenever you send an entity to another machine (client to server, or server to client), send its \u003cstrong>network ID\u003c/strong>, and convert back on the other side.\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"RegisterCommand('lock', function()\n    local vehicle = GetVehiclePedIsIn(PlayerPedId(), false)\n    if vehicle == 0 then return end\n\n    -- convert the local handle to a network ID before sending it\n    local netId = NetworkGetNetworkIdFromEntity(vehicle)\n    TriggerServerEvent('garage:lockVehicle', netId)\nend, false)"},{"t":"code","lang":"lua","file":"server.lua","code":"RegisterNetEvent('garage:lockVehicle', function(netId)\n    local src = source\n    if type(netId) ~= 'number' then return end\n\n    -- convert back to the server's own handle\n    local vehicle = NetworkGetEntityFromNetworkId(netId)\n    if vehicle == 0 or not DoesEntityExist(vehicle) then return end\n\n    -- only the driver may lock it (checked on the server, not trusted from the client)\n    if GetPedInVehicleSeat(vehicle, -1) ~= GetPlayerPed(src) then return end\n\n    SetVehicleDoorsLocked(vehicle, 2) -- 2 = locked\nend)"},{"t":"html","h":"\u003cp>On a client, a network ID is not always in scope either. Check it with \u003ccode>NetworkDoesEntityExistWithNetworkId(netId)\u003c/code> before converting it.\u003c/p>"}]}],"deeper":[{"title":"Quick reference: conversion natives","parts":[{"t":"html","h":"\u003cul>\u003cli>Player index to server ID: \u003ccode>GetPlayerServerId(player)\u003c/code> (client)\u003c/li>\u003cli>Server ID to player index: \u003ccode>GetPlayerFromServerId(serverId)\u003c/code> (client)\u003c/li>\u003cli>Player to ped: \u003ccode>GetPlayerPed(player)\u003c/code> on the client, \u003ccode>GetPlayerPed(source)\u003c/code> on the server\u003c/li>\u003cli>Ped to player index: \u003ccode>NetworkGetPlayerIndexFromPed(ped)\u003c/code> (client)\u003c/li>\u003cli>Entity to network ID: \u003ccode>NetworkGetNetworkIdFromEntity(entity)\u003c/code> (both)\u003c/li>\u003cli>Network ID to entity: \u003ccode>NetworkGetEntityFromNetworkId(netId)\u003c/code> (both)\u003c/li>\u003cli>The older aliases \u003ccode>PedToNet\u003c/code>, \u003ccode>NetToVeh\u003c/code> and friends do the same thing.\u003c/li>\u003c/ul>"}]}],"framework":[{"t":"html","h":"\u003cp>Frameworks use the server ID too: \u003ccode>QBCore.Functions.GetPlayer(source)\u003c/code> and \u003ccode>ESX.GetPlayerFromId(source)\u003c/code> both take the server ID. The player's permanent identity (their license) is a different thing again; you get it on the server with \u003ccode>GetPlayerIdentifierByType(source, 'license')\u003c/code>.\u003c/p>"}],"task":{"title":"Print your IDs","parts":[{"t":"html","h":"\u003col>\u003cli>Add a client command \u003ccode>/myid\u003c/code> that prints \u003ccode>PlayerId()\u003c/code> and \u003ccode>GetPlayerServerId(PlayerId())\u003c/code> to chat.\u003c/li>\u003cli>Ask a friend to join and run it too. Compare: server IDs differ per player, and your local indexes may not match theirs.\u003c/li>\u003cli>Add the \u003ccode>/lock\u003c/code> example. Lock a car as the driver, then try it as a passenger and confirm the server refuses.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"You need to tell the server which vehicle the player is in. What do you send?","opts":["The entity handle from GetVehiclePedIsIn","The network ID from NetworkGetNetworkIdFromEntity","The vehicle's plate text","The player index"],"why":"Entity handles are local to each machine. Network IDs mean the same thing everywhere.","answer":1},{"q":"In a server event handler, what kind of ID is \u003ccode>source\u003c/code>?","opts":["A player index from 0 to 128","The player's server ID","The player's ped","Their license identifier"],"why":"\u003ccode>source\u003c/code> is the server ID of the player who triggered the event.","answer":1},{"q":"On a client, \u003ccode>GetPlayerFromServerId(12)\u003c/code> returns -1. Why?","opts":["Server ID 12 is the console","That player is not in scope on this client right now","The function only works on the server","The player is dead"],"why":"A player connected to the server is not always known to every client, for example when they are far away.","answer":1}],"summary":"Players and entities have several kinds of IDs. Learn which one to use where, and which one to send between client and server."},{"id":"state-bags","group":"Networking","title":"State bags","mins":12,"docs":[{"label":"State Bags","url":"https://docs.fivem.net/docs/scripting-manual/networking/state-bags/"},{"label":"AddStateBagChangeHandler","url":"https://docs.fivem.net/natives/?_0x5BA35AAF"}],"sections":[{"title":"The three kinds of state","parts":[{"t":"html","h":"\u003cp>A \u003cstrong>state bag\u003c/strong> is a little table of values attached to something, which FiveM keeps in sync between server and clients for you.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Entity state:\u003c/strong> \u003ccode>Entity(vehicle).state\u003c/code> attached to a car, ped or object.\u003c/li>\u003cli>\u003cstrong>Player state:\u003c/strong> \u003ccode>Player(source).state\u003c/code> on the server, \u003ccode>LocalPlayer.state\u003c/code> for yourself on the client.\u003c/li>\u003cli>\u003cstrong>Global state:\u003c/strong> \u003ccode>GlobalState\u003c/code>, one bag for the whole server. Set by the server, readable by every client.\u003c/li>\u003c/ul>"},{"t":"code","lang":"lua","file":"server.lua","code":"-- server: set values (server-set state is replicated by default)\nGlobalState.weatherLocked = true\n\nRegisterCommand('duty', function(source)\n    if source == 0 then return end -- the console has no player state\n    local state = Player(source).state\n    local onDuty = not state.onDuty\n    state:set('onDuty', onDuty, true) -- true = replicate to clients\n    print(GetPlayerName(source) .. ' duty: ' .. tostring(onDuty))\nend, true) -- restricted: needs the command.duty ACE"},{"t":"code","lang":"lua","file":"client.lua","code":"-- client: read values\nRegisterCommand('amionduty', function()\n    TriggerEvent('chat:addMessage', {\n        args = { 'Duty', tostring(LocalPlayer.state.onDuty) }\n    })\n    print('weather locked?', GlobalState.weatherLocked)\nend, false)"}]},{"title":"Replication rules","parts":[{"t":"html","h":"\u003cp>By default, state set \u003cstrong>by the server is replicated\u003c/strong> to clients, and state set \u003cstrong>by a client is not\u003c/strong>. You can override this per value with \u003ccode>:set(key, value, replicated)\u003c/code>:\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"-- keep a value on the server only\nEntity(vehicle).state:set('clone', 600, false)"},{"t":"code","lang":"lua","file":"client.lua","code":"-- tell the server about something (only works on entities this client owns)\nEntity(enemy).state:set('taskAck', 'guard', true)"}]},{"title":"Shallow means shallow","parts":[{"t":"html","h":"\u003cp>Each read gives you a fresh copy, and only a \u003cstrong>direct\u003c/strong> assignment is sent back. Changing a value inside a nested table does nothing.\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"-- will NOT replicate: you changed a copy\nEntity(vehicle).state.tuning.color = 'red'\n\n-- slow: deserializes the whole tuning table twice\nlocal a = Entity(vehicle).state.tuning.color\nlocal b = Entity(vehicle).state.tuning.wheels\n\n-- better: use flat keys\nEntity(vehicle).state['tuning:color'] = 'red'"}]},{"title":"Reacting to changes","parts":[{"t":"html","h":"\u003cp>\u003ccode>AddStateBagChangeHandler(key, bagFilter, handler)\u003c/code> runs a function every time a key changes. The handler receives \u003ccode>bagName, key, value, reserved, replicated\u003c/code>. Use \u003ccode>GetPlayerFromStateBagName\u003c/code> or \u003ccode>GetEntityFromStateBagName\u003c/code> to turn the bag name back into something useful. Careful: on the server \u003ccode>GetPlayerFromStateBagName\u003c/code> gives the player's server ID, but on the client it gives the local player handle (the kind \u003ccode>PlayerId()\u003c/code> returns).\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"AddStateBagChangeHandler('onDuty', nil, function(bagName, key, value)\n    -- on the client this is a player handle, so compare it with PlayerId()\n    local player = GetPlayerFromStateBagName(bagName)\n    if player ~= PlayerId() then return end -- only react to MY duty changing\n\n    TriggerEvent('chat:addMessage', {\n        args = { 'Duty', value and 'You are now on duty.' or 'You are now off duty.' }\n    })\nend)"},{"t":"html","h":"\u003cp>While the handler runs, the bag still holds the \u003cem>old\u003c/em> value; the new one is the \u003ccode>value\u003c/code> argument.\u003c/p>"}]},{"title":"Who may write state","parts":[{"t":"html","h":"\u003cp>By default, \u003cstrong>player state can be written by that player and the server\u003c/strong>, entity state by the entity's owner and the server, and global state only by the server.\u003c/p>\n\u003cdiv class=\"callout warn\">\u003cspan class=\"callout-tag\">warning\u003c/span>\u003cp>That default means a cheater can write to their own player state. Never use client-writable state for permissions, money or jobs without checking it on the server. To make every state bag server-only, set the \u003ccode>sv_stateBagStrictMode\u003c/code> convar to \u003ccode>true\u003c/code> in \u003ccode>server.cfg\u003c/code>.\u003c/p>\u003c/div>"},{"t":"code","lang":"cfg","file":"server.cfg","code":"setr sv_stateBagStrictMode true"}]}],"deeper":[{"title":"When to use state bags vs events","parts":[{"t":"html","h":"\u003cul>\u003cli>Use a \u003cstrong>state bag\u003c/strong> for a \u003cem>current value\u003c/em> that late joiners should also see: is this car's engine broken, is this player on duty, is the bank closed.\u003c/li>\u003cli>Use an \u003cstrong>event\u003c/strong> for a \u003cem>one-off action\u003c/em>: show this notification, play this sound, open this menu.\u003c/li>\u003cli>Changing a state bag every frame is expensive. Set it when the value actually changes.\u003c/li>\u003c/ul>"}]}],"framework":[{"t":"html","h":"\u003cp>QBCore and ESX store player data in their own objects, but many modern scripts (ox_inventory, qbx_core, pma-voice) use state bags heavily. For example, pma-voice keeps the player's radio channel in player state, which is why other resources can read it without calling pma-voice directly.\u003c/p>"}],"task":{"title":"Build a duty toggle","parts":[{"t":"html","h":"\u003col>\u003cli>Add the server \u003ccode>/duty\u003c/code> command and the client change handler to a test resource.\u003c/li>\u003cli>Give yourself the ACE: \u003ccode>add_ace group.admin command.duty allow\u003c/code> in \u003ccode>server.cfg\u003c/code> (you need to be in \u003ccode>group.admin\u003c/code>).\u003c/li>\u003cli>Run \u003ccode>/duty\u003c/code> a few times and watch the chat messages.\u003c/li>\u003cli>Restart only the client side by reconnecting, then run \u003ccode>/amionduty\u003c/code>: the value survives because the server owns it.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"Why does \u003ccode>Entity(veh).state.tuning.color = 'red'\u003c/code> not replicate?","opts":["Entity state only accepts numbers","State bags are shallow: you modified a copy, not the bag","Only the server can write entity state","The key name is too long"],"why":"Every read returns a copy. Only a direct set like \u003ccode>state['tuning:color'] = 'red'\u003c/code> is written back.","answer":1},{"q":"Who can write to \u003ccode>GlobalState\u003c/code> by default?","opts":["Any client","The client who owns the most entities","The server","Nobody, it is read-only"],"why":"Global state is server-set and client-read.","answer":2},{"q":"How do you stop clients from writing to any state bag?","opts":["Use AddEventHandler instead","Set sv_stateBagStrictMode to true","Add lua54 'yes'","Call CancelEvent in a change handler"],"why":"With strict mode on, only the server can modify state bags. Change handlers cannot reject changes.","answer":1}],"summary":"State bags attach key/value data to players, entities, or the whole server, and sync it automatically."},{"id":"events","group":"Events","title":"Working with events","mins":16,"docs":[{"label":"Working with events","url":"https://docs.fivem.net/docs/scripting-manual/working-with-events/"},{"label":"Listening for events","url":"https://docs.fivem.net/docs/scripting-manual/working-with-events/listening-for-events/"},{"label":"Triggering events","url":"https://docs.fivem.net/docs/scripting-manual/working-with-events/triggering-events/"},{"label":"Canceling events","url":"https://docs.fivem.net/docs/scripting-manual/working-with-events/canceling-events/"}],"sections":[{"title":"What an event is","parts":[{"t":"html","h":"\u003cp>An \u003cstrong>event\u003c/strong> is a named message with optional values attached. One script \u003cem>triggers\u003c/em> it, any number of scripts \u003cem>listen\u003c/em> for it. Events are how a client tells the server \"I pressed the shop button\", and how the server tells a client \"show this message\".\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Client events\u003c/strong> can only be \u003cem>listened for\u003c/em> in client scripts, but can be \u003cem>triggered\u003c/em> from client or server.\u003c/li>\u003cli>\u003cstrong>Server events\u003c/strong> can only be \u003cem>listened for\u003c/em> in server scripts, but can be \u003cem>triggered\u003c/em> from server or client.\u003c/li>\u003c/ul>"}]},{"title":"Listening","parts":[{"t":"html","h":"\u003cp>\u003ccode>AddEventHandler\u003c/code> listens for an event triggered \u003cstrong>on the same side\u003c/strong> (client to client, server to server).\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"AddEventHandler('myresource:doorOpened', function(doorName, byPlayer)\n    print(doorName .. ' was opened')\nend)"},{"t":"html","h":"\u003cp>To accept an event \u003cstrong>from the other side\u003c/strong> (client to server or server to client), register it as a network event. The modern way is \u003ccode>RegisterNetEvent\u003c/code> with the handler passed straight in:\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"RegisterNetEvent('myresource:buyItem', function(itemName)\n    local src = source -- the server ID of the player who sent it\n    print(GetPlayerName(src) .. ' wants to buy ' .. tostring(itemName))\nend)"},{"t":"html","h":"\u003cdiv class=\"callout\">\u003cspan class=\"callout-tag\">note\u003c/span>\u003cp>\u003ccode>RegisterNetEvent('name', handler)\u003c/code> is just shorthand for \u003ccode>RegisterNetEvent('name')\u003c/code> followed by \u003ccode>AddEventHandler('name', handler)\u003c/code>. Registering only marks the event as allowed over the network; it does \u003cstrong>not\u003c/strong> block the same side from triggering it.\u003c/p>\u003c/div>"}]},{"title":"Save source right away","parts":[{"t":"html","h":"\u003cp>On the server, the global \u003ccode>source\u003c/code> holds the player who triggered the event, but it is only guaranteed during the first part of the handler. After a \u003ccode>Wait\u003c/code> (or any async work) it is reset. Copy it into a local first.\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"RegisterNetEvent('myresource:slowThing', function()\n    local src = source -- copy it now\n\n    Wait(2000)          -- source is no longer reliable after this\n\n    TriggerClientEvent('chat:addMessage', src, { args = { 'Done!' } })\nend)"}]},{"title":"Triggering","parts":[{"t":"html","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>You are in\u003c/th>\u003cth>You want to reach\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Client\u003c/td>\u003ctd>Same client\u003c/td>\u003ctd>\u003ccode>TriggerEvent(name, ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Server\u003c/td>\u003ctd>Same server\u003c/td>\u003ctd>\u003ccode>TriggerEvent(name, ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>\u003ccode>TriggerServerEvent(name, ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Server\u003c/td>\u003ctd>One client\u003c/td>\u003ctd>\u003ccode>TriggerClientEvent(name, playerId, ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Server\u003c/td>\u003ctd>Every client\u003c/td>\u003ctd>\u003ccode>TriggerClientEvent(name, -1, ...)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>For large payloads (several KB or more), use the \u003cstrong>latent\u003c/strong> versions. They send data gradually at a rate in bytes per second, so they do not block the network channel. A \u003ccode>bps\u003c/code> of \u003ccode>0\u003c/code> or \u003ccode>-1\u003c/code> uses the default 25000.\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"-- send a big table to one player at 50 KB/s\nTriggerLatentClientEvent('myresource:bigData', playerId, 50000, bigTable)"},{"t":"code","lang":"lua","file":"client.lua","code":"TriggerLatentServerEvent('myresource:uploadLog', 0, longText)"}]},{"title":"A complete example: /report","parts":[{"t":"html","h":"\u003cp>A player sends a report; the server checks it and forwards it to every staff member.\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"RegisterCommand('report', function(source, args)\n    local message = table.concat(args, ' ')\n    if message == '' then\n        TriggerEvent('chat:addMessage', { args = { 'Usage', '/report your message' } })\n        return\n    end\n    TriggerServerEvent('report:send', message)\nend, false)\n\nRegisterNetEvent('report:show', function(senderName, senderId, message)\n    TriggerEvent('chat:addMessage', {\n        color = { 255, 120, 80 },\n        multiline = true,\n        args = { ('REPORT from %s [%d]'):format(senderName, senderId), message }\n    })\nend)"},{"t":"code","lang":"lua","file":"server.lua","code":"local lastReport = {}\n\nRegisterNetEvent('report:send', function(message)\n    local src = source\n\n    -- never trust the client: check type and length\n    if type(message) ~= 'string' or #message == 0 or #message > 200 then return end\n\n    -- simple cooldown: one report every 30 seconds\n    local now = os.time()\n    if lastReport[src] and now - lastReport[src] \u003c 30 then return end\n    lastReport[src] = now\n\n    local name = GetPlayerName(src)\n    for _, playerId in ipairs(GetPlayers()) do\n        if IsPlayerAceAllowed(playerId, 'report.view') then\n            TriggerClientEvent('report:show', playerId, name, src, message)\n        end\n    end\nend)\n\nAddEventHandler('playerDropped', function()\n    lastReport[source] = nil\nend)"},{"t":"code","lang":"cfg","file":"server.cfg","code":"add_ace group.admin report.view allow"}]},{"title":"Canceling events","parts":[{"t":"html","h":"\u003cp>Inside a handler you can call \u003ccode>CancelEvent()\u003c/code>. The resource that triggered the event can then check \u003ccode>WasEventCanceled()\u003c/code>, and in Lua \u003ccode>TriggerEvent\u003c/code> itself returns true when it was canceled. Canceling does \u003cstrong>not\u003c/strong> stop other handlers from running, and it only works for \u003cstrong>local\u003c/strong> events (not ones from across the network).\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"AddEventHandler('myresource:beforeSpawn', function(model)\n    if model == 'rhino' then\n        CancelEvent() -- no tanks today\n    end\nend)\n\nif TriggerEvent('myresource:beforeSpawn', 'rhino') then\n    print('Another script canceled the spawn')\nend"}]}],"deeper":[{"title":"Built-in events you will use","parts":[{"t":"html","h":"\u003cul>\u003cli>\u003ccode>playerJoining\u003c/code> and \u003ccode>playerDropped\u003c/code> (server): a player connected or left. In \u003ccode>playerDropped\u003c/code>, clean up any tables keyed by \u003ccode>source\u003c/code>.\u003c/li>\u003cli>\u003ccode>playerConnecting\u003c/code> (server): during connection, with deferrals for queue and whitelist checks.\u003c/li>\u003cli>\u003ccode>onResourceStart\u003c/code> and \u003ccode>onResourceStop\u003c/code> (both): the first argument is the resource name. Compare it with \u003ccode>GetCurrentResourceName()\u003c/code> to run setup or cleanup for your own resource.\u003c/li>\u003cli>\u003ccode>chat:addMessage\u003c/code> (client): print to the chat box.\u003c/li>\u003c/ul>"}]},{"title":"C# and JavaScript","parts":[{"t":"html","h":"\u003cp>In JS, \u003ccode>on(name, fn)\u003c/code> listens locally, \u003ccode>onNet(name, fn)\u003c/code> listens over the network, \u003ccode>emit\u003c/code> triggers locally and \u003ccode>emitNet(name, ...)\u003c/code> triggers on the server (or \u003ccode>emitNet(name, playerId, ...)\u003c/code> from the server to a client). C# does not need event registration; it reads \u003ccode>source\u003c/code> through the \u003ccode>[FromSource] Player source\u003c/code> parameter attribute.\u003c/p>"}]}],"framework":[{"t":"html","h":"\u003cp>QBCore and ESX use the same events. Their names usually follow \u003ccode>resource:side:action\u003c/code>, like \u003ccode>QBCore:Server:OnPlayerLoaded\u003c/code> or \u003ccode>esx:playerLoaded\u003c/code>. When you see \u003ccode>TriggerServerEvent('qb-shops:server:buy', ...)\u003c/code> in a script, that is exactly the pattern from this lesson, and it needs the same server-side checks.\u003c/p>"}],"task":{"title":"Build the /report system","parts":[{"t":"html","h":"\u003col>\u003cli>Put the client and server code above in a resource called \u003ccode>reports\u003c/code>.\u003c/li>\u003cli>Add the \u003ccode>add_ace\u003c/code> line to \u003ccode>server.cfg\u003c/code> and make sure your own license is in \u003ccode>group.admin\u003c/code>.\u003c/li>\u003cli>Restart the server (ACE changes in \u003ccode>server.cfg\u003c/code> load on boot), then \u003ccode>/report test\u003c/code> in game.\u003c/li>\u003cli>Spam \u003ccode>/report\u003c/code> and confirm the 30 second cooldown blocks the extra ones.\u003c/li>\u003cli>Bonus: send the reporter a confirmation message using \u003ccode>TriggerClientEvent('chat:addMessage', src, ...)\u003c/code>.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"A client script triggers \u003ccode>TriggerServerEvent('bank:deposit', 100)\u003c/code>. How must the server listen for it?","opts":["AddEventHandler('bank:deposit', ...) alone","RegisterNetEvent('bank:deposit', function(amount) ... end)","RegisterCommand('bank:deposit', ...)","TriggerEvent('bank:deposit')"],"why":"Events coming from the other side must be registered as network events.","answer":1},{"q":"Why copy \u003ccode>local src = source\u003c/code> at the top of a server event handler?","opts":["Because source is a string","Because source can be reset after a Wait or async call","To make the code faster","Because source is nil until you copy it"],"why":"The global source is only guaranteed during the first synchronous part of the handler.","answer":1},{"q":"You need to send a table of several hundred KB from the server to one client. What should you use?","opts":["TriggerClientEvent with -1","TriggerLatentClientEvent with a bps value","A state bag that changes every frame","TriggerEvent"],"why":"Latent events trickle large payloads without blocking the client's network channel and timing them out.","answer":1}],"summary":"Events are how resources and machines talk. Learn to listen, register network events, trigger across client and server, and cancel."},{"id":"nui","group":"NUI","title":"Web interfaces with NUI","mins":18,"docs":[{"label":"User interfaces with NUI","url":"https://docs.fivem.net/docs/scripting-manual/nui-development/"},{"label":"Fullscreen NUI","url":"https://docs.fivem.net/docs/scripting-manual/nui-development/full-screen-nui/"},{"label":"NUI callbacks","url":"https://docs.fivem.net/docs/scripting-manual/nui-development/nui-callbacks/"},{"label":"Loading screens","url":"https://docs.fivem.net/docs/scripting-manual/nui-development/loading-screens/"},{"label":"Direct-rendered UI (DUI)","url":"https://docs.fivem.net/docs/scripting-manual/nui-development/dui/"}],"sections":[{"title":"What NUI is","parts":[{"t":"html","h":"\u003cp>\u003cstrong>NUI\u003c/strong> (\"new UI\") lets a resource show a web page over the game, rendered by an embedded Chromium. Anything you can build for a browser (plain HTML, React, Vue, even WebGL) can become an in-game menu, HUD or phone.\u003c/p>\n\u003cp>Data flows in two directions:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Lua to page:\u003c/strong> \u003ccode>SendNUIMessage(table)\u003c/code> in a client script; the page receives it with a \u003ccode>message\u003c/code> event listener.\u003c/li>\u003cli>\u003cstrong>Page to Lua:\u003c/strong> the page calls \u003ccode>fetch('https://resource-name/callbackName', ...)\u003c/code>; Lua answers with \u003ccode>RegisterNuiCallback\u003c/code>.\u003c/li>\u003c/ul>"}]},{"title":"Step 1: the manifest","parts":[{"t":"html","h":"\u003cp>Set one \u003ccode>ui_page\u003c/code> and list \u003cstrong>every\u003c/strong> file the page needs in \u003ccode>files\u003c/code>, or the client never downloads them.\u003c/p>"},{"t":"code","lang":"lua","file":"fxmanifest.lua","code":"fx_version 'cerulean'\ngame 'gta5'\n\nclient_script 'client.lua'\n\nui_page 'html/index.html'\n\nfiles {\n    'html/index.html',\n    'html/style.css',\n    'html/app.js'\n}"}]},{"title":"Step 2: open and close from Lua","parts":[{"t":"html","h":"\u003cp>\u003ccode>SetNuiFocus(hasFocus, hasCursor)\u003c/code> gives the page the keyboard and the mouse cursor. Always give it back when the menu closes, or the player is stuck with a cursor.\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"local isOpen = false\n\nlocal function setMenu(open)\n    isOpen = open\n    SetNuiFocus(open, open)\n    SendNUIMessage({ type = open and 'open' or 'close' })\nend\n\nRegisterCommand('menu', function()\n    setMenu(not isOpen)\nend, false)\n\n-- the page asks us to close (Escape key or close button)\nRegisterNuiCallback('close', function(data, cb)\n    setMenu(false)\n    cb({ ok = true }) -- ALWAYS answer, or the page's fetch times out\nend)\n\n-- the page sends the button the player picked\nRegisterNuiCallback('choose', function(data, cb)\n    setMenu(false)\n    TriggerEvent('chat:addMessage', { args = { 'Menu', 'You picked ' .. tostring(data.option) } })\n    cb({ ok = true })\nend)\n\n-- never leave focus stuck if the resource is restarted while open\nAddEventHandler('onResourceStop', function(resourceName)\n    if resourceName == GetCurrentResourceName() then\n        SetNuiFocus(false, false)\n    end\nend)"}]},{"title":"Step 3: the page","parts":[{"t":"html","h":"\u003cp>The page starts hidden, listens for messages from Lua, and calls back with \u003ccode>fetch\u003c/code>. \u003ccode>GetParentResourceName()\u003c/code> is a function FiveM provides inside NUI pages; it returns your resource name so you never hard-code it.\u003c/p>"},{"t":"code","lang":"html","file":"html/index.html","code":"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n    \u003cmeta charset=\"utf-8\">\n    \u003clink rel=\"stylesheet\" href=\"style.css\">\n\u003c/head>\n\u003cbody>\n    \u003cdiv id=\"menu\" class=\"hidden\">\n        \u003ch1>City Services\u003c/h1>\n        \u003cbutton data-option=\"taxi\">Call a taxi\u003c/button>\n        \u003cbutton data-option=\"mechanic\">Call a mechanic\u003c/button>\n        \u003cbutton id=\"close\">Close\u003c/button>\n    \u003c/div>\n    \u003cscript src=\"app.js\">\u003c/script>\n\u003c/body>\n\u003c/html>"},{"t":"code","lang":"js","file":"html/app.js","code":"const menu = document.getElementById('menu');\n\nfunction post(name, data = {}) {\n    return fetch(`https://${GetParentResourceName()}/${name}`, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json; charset=UTF-8' },\n        body: JSON.stringify(data)\n    }).then(resp => resp.json());\n}\n\n// messages from Lua (SendNUIMessage)\nwindow.addEventListener('message', (event) => {\n    if (event.data.type === 'open') menu.classList.remove('hidden');\n    if (event.data.type === 'close') menu.classList.add('hidden');\n});\n\ndocument.querySelectorAll('[data-option]').forEach((button) => {\n    button.addEventListener('click', () => post('choose', { option: button.dataset.option }));\n});\n\ndocument.getElementById('close').addEventListener('click', () => post('close'));\n\ndocument.addEventListener('keydown', (event) => {\n    if (event.key === 'Escape') post('close');\n});"},{"t":"code","lang":"css","file":"html/style.css","code":"body { margin: 0; font-family: sans-serif; background: transparent; }\n.hidden { display: none !important; }\n#menu {\n    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);\n    width: 280px; padding: 20px; border-radius: 10px;\n    background: rgba(15, 20, 28, 0.95); color: #fff;\n    display: flex; flex-direction: column; gap: 8px;\n}\n#menu button { padding: 10px; border: 0; border-radius: 6px; cursor: pointer; }"},{"t":"html","h":"\u003cdiv class=\"callout\">\u003cspan class=\"callout-tag\">note\u003c/span>\u003cp>Keep the page background \u003ccode>transparent\u003c/code>, or a white rectangle will cover the game.\u003c/p>\u003c/div>"}]},{"title":"Callbacks: the rules","parts":[{"t":"html","h":"\u003cul>\u003cli>Data both ways \u003cstrong>must be JSON-encodable\u003c/strong> (no functions, no entity handles that mean nothing on the page).\u003c/li>\u003cli>\u003cstrong>Always call \u003ccode>cb\u003c/code>\u003c/strong>, even with just \u003ccode>{ ok = true }\u003c/code>. If you do not, the page's \u003ccode>fetch\u003c/code> hangs, times out and throws an error.\u003c/li>\u003cli>POST bodies arrive in Lua already decoded as a table (\u003ccode>data.option\u003c/code> above), and whatever you pass to \u003ccode>cb\u003c/code> arrives in the page as JSON.\u003c/li>\u003c/ul>"}]},{"title":"Referencing files and debugging","parts":[{"t":"html","h":"\u003cp>Inside a page you can load files from any resource with the \u003ccode>https://cfx-nui-resourcename/path\u003c/code> scheme (the old \u003ccode>nui://\u003c/code> scheme is no longer a secure context). The developer tools live at \u003ccode>http://localhost:13172/\u003c/code> while the game is running, or \u003ccode>nui_devTools\u003c/code> in \u003ckbd>F8\u003c/kbd>. NUI focus is a stack: the most recently focused resource sits on top, and there is no click-through to resources underneath.\u003c/p>"}]},{"title":"NUI callback strict mode","parts":[{"t":"html","h":"\u003cp>Without strict mode, \u003cstrong>any\u003c/strong> resource's NUI page could call your callbacks. If a callback hands out sensitive data or admin actions, a malicious resource could abuse it. Strict mode means only your own resource's page can call your callbacks.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Platform\u003c/th>\u003cth>Default\u003c/th>\u003cth>To change\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>FiveM for GTAV Enhanced\u003c/td>\u003ctd>Enabled\u003c/td>\u003ctd>\u003ccode>nui_callback_strict_mode 'false'\u003c/code> in the manifest to opt out\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FiveM Legacy\u003c/td>\u003ctd>Disabled\u003c/td>\u003ctd>\u003ccode>nui_callback_strict_mode 'true'\u003c/code> in the manifest to opt in\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>If two resources really must share data, expose an \u003cstrong>export\u003c/strong> in the provider resource and add a small proxy NUI callback in the consumer that calls the export.\u003c/p>"}]}],"deeper":[{"title":"Loading screens","parts":[{"t":"html","h":"\u003cp>A loading screen is a special NUI page shown while players join. Declare it with \u003ccode>loadscreen 'index.html'\u003c/code> (and list the file under \u003ccode>file\u003c/code> or \u003ccode>files\u003c/code>). Add \u003ccode>loadscreen_cursor 'yes'\u003c/code> to show the cursor. Server scripts can pass data to it with \u003ccode>deferrals.handover\u003c/code> in \u003ccode>playerConnecting\u003c/code>; the page reads it from \u003ccode>window.nuiHandoverData\u003c/code>.\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"AddEventHandler('playerConnecting', function(_, _, deferrals)\n    local source = source\n    deferrals.handover({ name = GetPlayerName(source) })\nend)"},{"t":"code","lang":"html","file":"loadscreen.html","code":"\u003cprogress id=\"bar\" value=\"0\" max=\"1\">\u003c/progress>\n\u003cscript>\nwindow.addEventListener('message', (event) => {\n    if (event.data.eventName !== 'loadProgress') return;\n    document.getElementById('bar').value = event.data.loadFraction;\n});\n\u003c/script>"},{"t":"html","h":"\u003cp>Use \u003ccode>innerText\u003c/code> (not \u003ccode>innerHTML\u003c/code>) when you show player names: names are user input and could contain HTML. By default the screen closes when \u003ccode>ShutdownLoadingScreen\u003c/code> runs; with \u003ccode>loadscreen_manual_shutdown 'yes'\u003c/code> you control it with \u003ccode>ShutdownLoadingScreenNui\u003c/code>.\u003c/p>"}]},{"title":"DUI: web pages on in-game surfaces","parts":[{"t":"html","h":"\u003cp>\u003cstrong>DUI\u003c/strong> renders a web page to a texture instead of the screen, for TV screens, cinema walls or billboards. The key natives are \u003ccode>CreateDui\u003c/code>, \u003ccode>GetDuiHandle\u003c/code>, \u003ccode>CreateRuntimeTextureFromDuiHandle\u003c/code>, \u003ccode>SetDuiUrl\u003c/code>, \u003ccode>SendDuiMessage\u003c/code> and \u003ccode>DestroyDui\u003c/code>. You can then draw the texture with \u003ccode>DrawSprite\u003c/code> or put it on a render target.\u003c/p>"}]}],"framework":[{"t":"html","h":"\u003cp>Phones, inventories and menus on RP servers (qb-inventory, ox_lib menus, phone resources) are all NUI with this exact pattern. When a UI gets stuck open after a crash, the cause is almost always a missing \u003ccode>SetNuiFocus(false, false)\u003c/code>.\u003c/p>"}],"task":{"title":"Build a services menu","parts":[{"t":"html","h":"\u003col>\u003cli>Create a resource \u003ccode>servicesmenu\u003c/code> with the manifest, \u003ccode>client.lua\u003c/code>, and the three \u003ccode>html\u003c/code> files above.\u003c/li>\u003cli>\u003ccode>refresh; ensure servicesmenu\u003c/code>, then type \u003ccode>/menu\u003c/code> in game. Click a button and press Escape.\u003c/li>\u003cli>Open \u003ccode>http://localhost:13172/\u003c/code> in your browser, inspect the page, and find your buttons.\u003c/li>\u003cli>Comment out \u003ccode>cb({ ok = true })\u003c/code> in the \u003ccode>choose\u003c/code> callback, restart, click a button, and watch the error in dev tools. Then put it back.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"A NUI callback handler never calls \u003ccode>cb\u003c/code>. What happens?","opts":["Nothing, cb is optional","The page's fetch request hangs, times out and errors","The game crashes","Lua retries the callback"],"why":"The docs say you must always return data through the callback, even just \u003ccode>{ ok = true }\u003c/code>.","answer":1},{"q":"How does a client script send data to its NUI page?","opts":["TriggerClientEvent","SendNUIMessage, received by a 'message' event listener in the page","fetch() from Lua","RegisterNuiCallback"],"why":"SendNUIMessage posts a message to the page. RegisterNuiCallback handles the opposite direction.","answer":1},{"q":"On FiveM for GTAV Enhanced, NUI callback strict mode is on by default. What does it do?","opts":["Blocks all fetch calls","Only the resource's own NUI page can call its callbacks","Requires HTTPS certificates","Disables SendNUIMessage"],"why":"Strict mode stops other resources' pages from calling your callbacks. Use exports for deliberate sharing.","answer":1}],"summary":"Build in-game menus with HTML, CSS and JavaScript: open them from Lua, send data both ways, and handle focus safely."},{"id":"voice","group":"Voice","title":"Voice chat","mins":12,"docs":[{"label":"Voice","url":"https://docs.fivem.net/docs/scripting-manual/voice/"},{"label":"Legacy vs Enhanced","url":"https://docs.fivem.net/docs/developers/legacy-vs-enhanced/"}],"sections":[{"title":"Two voice systems","parts":[{"t":"html","h":"\u003cul>\u003cli>\u003cstrong>FiveM Legacy\u003c/strong> uses a built-in \u003cstrong>Mumble\u003c/strong> client for voice. Its natives (\u003ccode>Mumble...\u003c/code>) run on the client.\u003c/li>\u003cli>\u003cstrong>FiveM for GTAV Enhanced\u003c/strong> ships a new voice system with better quality on bad connections, noise cancellation and echo cancellation. Mumble is \u003cstrong>deprecated\u003c/strong> there and will be removed; the new natives run on the \u003cstrong>server\u003c/strong> only.\u003c/li>\u003c/ul>\n\u003cdiv class=\"callout\">\u003cspan class=\"callout-tag\">note\u003c/span>\u003cp>Most RP servers use a voice resource such as \u003cstrong>pma-voice\u003c/strong>, which already handles proximity, radios and phone calls. If you run one, do not add your own channel code on top of it; use its exports instead. The examples below are for learning how it works underneath.\u003c/p>\u003c/div>"}]},{"title":"Mumble: proximity and settings","parts":[{"t":"html","h":"\u003cp>\u003ccode>MumbleSetTalkerProximity\u003c/code> sets how far your voice carries. Call it on the client. (\u003ccode>NetworkSetTalkerProximity\u003c/code> also exists on FiveM; it calls the original game native before setting Mumble's distance.)\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"-- whisper / normal / shout, cycled with a command\nlocal ranges = { 3.0, 8.0, 15.0 }\nlocal current = 2\n\nRegisterCommand('voicerange', function()\n    current = current % #ranges + 1\n    MumbleSetTalkerProximity(ranges[current])\n    TriggerEvent('chat:addMessage', { args = { 'Voice', ('Range: %.0fm'):format(ranges[current]) } })\nend, false)"},{"t":"html","h":"\u003cp>Players can tune voice in \u003ckbd>F8\u003c/kbd> with convars like \u003ccode>voice_inBitrate\u003c/code> (16000 to 128000, default 48000). On Legacy there are also \u003ccode>voice_use2dAudio\u003c/code>, \u003ccode>voice_useSendingRangeOnly\u003c/code> and \u003ccode>voice_useNativeAudio\u003c/code>; the last one must be \u003ccode>true\u003c/code> for submixes.\u003c/p>"}]},{"title":"Submixes: a radio effect","parts":[{"t":"html","h":"\u003cp>A \u003cstrong>submix\u003c/strong> applies audio effects to a player's voice, for example a crackly radio filter.\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"local radioSubmix = CreateAudioSubmix('myRadio') -- returns the existing one if it already exists\n\nif radioSubmix ~= -1 then\n    SetAudioSubmixEffectRadioFx(radioSubmix, 1)                 -- radio FX in effect slot 1\n    SetAudioSubmixEffectParamInt(radioSubmix, 1, `default`, 1)\n    SetAudioSubmixEffectParamFloat(radioSubmix, 1, `freq_low`, 300.0)\n    SetAudioSubmixEffectParamFloat(radioSubmix, 1, `freq_hi`, 6000.0)\n    AddAudioSubmixOutput(radioSubmix, 1)\nend\n\n-- apply it to one player (by server ID); pass -1 to remove it again\nlocal function setRadioFilter(serverId, enabled)\n    MumbleSetSubmixForServerId(serverId, enabled and radioSubmix or -1)\nend"}]},{"title":"Mumble channels (and the catch)","parts":[{"t":"html","h":"\u003cp>\u003ccode>MumbleSetVoiceChannel(id)\u003c/code> moves a client into a voice channel, which is one way to build a radio. The docs warn that this \u003cstrong>removes the player from the default Root channel, so normal proximity chat stops working\u003c/strong> for them. That is why pma-voice uses voice targets instead. Channels can be listened to with \u003ccode>MumbleAddVoiceChannelListen(id)\u003c/code> and left with \u003ccode>MumbleRemoveVoiceChannelListen(id)\u003c/code>. The docs' full Mumble radio example syncs channel members from the server with events.\u003c/p>"}]},{"title":"The new voice API (Enhanced)","parts":[{"t":"html","h":"\u003cp>On FiveM for GTAV Enhanced, enable the built-in voice server in \u003ccode>server.cfg\u003c/code>, then manage everything from server scripts. The server owns membership, mute and deaf state, so clients cannot sneak into a channel.\u003c/p>"},{"t":"code","lang":"cfg","file":"server.cfg","code":"voice_internal\n\n# only if you must keep old Mumble scripts working (less secure):\n# setr sv_mumble true"},{"t":"code","lang":"lua","file":"server.lua","code":"local radioChannels = {} -- radio number -> voice channel ID\n\nlocal function getOrCreateChannel(radio)\n    if not radioChannels[radio] then\n        radioChannels[radio] = CreateVoiceChannel(0, 0.0) -- mode 0 = non-spatial (radio)\n    end\n    return radioChannels[radio]\nend\n\nlocal function leaveAllChannels(playerId)\n    for _, channelId in pairs(radioChannels) do\n        RemovePlayerFromVoiceChannel(channelId, playerId)\n    end\nend\n\nRegisterCommand('joinradio', function(source, args)\n    local radio = tonumber(args[1])\n    if not radio then return end\n    leaveAllChannels(source)\n    AddPlayerToVoiceChannel(getOrCreateChannel(radio), source)\nend, false)\n\nRegisterCommand('leaveradio', function(source)\n    leaveAllChannels(source)\nend, false)\n\n-- players are removed from every channel automatically when they disconnect"},{"t":"html","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mode\u003c/th>\u003cth>Name\u003c/th>\u003cth>Behaviour\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>Non-spatial\u003c/td>\u003ctd>2D channel, everyone in it hears everyone (radios, phone calls)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Spatial\u003c/td>\u003ctd>3D, hears speakers within \u003ccode>maxDistance\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Custom\u003c/td>\u003ctd>No automatic receivers yet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Temporary\u003c/td>\u003ctd>Like spatial, deleted when the last player leaves\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Other server natives: \u003ccode>DeleteVoiceChannel\u003c/code>, \u003ccode>SetPlayerMutedInVoiceChannel\u003c/code> (can hear, cannot speak) and \u003ccode>SetPlayerDeafInVoiceChannel\u003c/code> (can speak, cannot hear). A pure listener is added, then muted.\u003c/p>\n\u003cdiv class=\"callout warn\">\u003cspan class=\"callout-tag\">warning\u003c/span>\u003cp>Turning on \u003ccode>sv_mumble\u003c/code> for old scripts lets any client join any Mumble channel and listen to any conversation. Prefer migrating to the server API.\u003c/p>\u003c/div>"}]}],"deeper":[{"title":"Mumble to Enhanced cheat sheet","parts":[{"t":"html","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Deprecated (client)\u003c/th>\u003cth>Replacement (server)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>MumbleCreateChannel(id)\u003c/code>\u003c/td>\u003ctd>\u003ccode>CreateVoiceChannel(mode, maxDistance)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>MumbleSetVoiceChannel(id)\u003c/code>\u003c/td>\u003ctd>\u003ccode>AddPlayerToVoiceChannel(channelID, clientID)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Leaving a channel\u003c/td>\u003ctd>\u003ccode>RemovePlayerFromVoiceChannel(channelID, clientID)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Implicit cleanup\u003c/td>\u003ctd>\u003ccode>DeleteVoiceChannel(channelID)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client mute logic\u003c/td>\u003ctd>\u003ccode>SetPlayerMutedInVoiceChannel(channelID, clientID, muted)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client listen logic\u003c/td>\u003ctd>\u003ccode>SetPlayerDeafInVoiceChannel(channelID, clientID, deaf)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>These Enhanced natives come from the Voice guide and may not appear in the Legacy native list yet.\u003c/p>"}]}],"framework":[{"t":"html","h":"\u003cp>On QBCore and ESX servers, radios and phones normally call pma-voice exports (for example setting a radio channel) rather than Mumble natives directly. Check your voice resource's documentation before writing voice code.\u003c/p>"}],"task":{"title":"Try voice range","parts":[{"t":"html","h":"\u003col>\u003cli>On a \u003cstrong>test\u003c/strong> server (or with your voice resource stopped), add the \u003ccode>/voicerange\u003c/code> command to a resource.\u003c/li>\u003cli>Join with a friend, stand apart, and cycle the range while one of you talks.\u003c/li>\u003cli>If you are on FiveM for GTAV Enhanced, add \u003ccode>voice_internal\u003c/code> to the test server's config, add the radio commands, and both \u003ccode>/joinradio 1\u003c/code> from opposite ends of the map.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"On FiveM for GTAV Enhanced, where do the new voice channel natives run?","opts":["On the client, like Mumble","On the server only","In NUI pages","In both client and server"],"why":"The server owns channel membership, mute and deaf state, which removes the old client-side security problems.","answer":1},{"q":"What happens when a client calls \u003ccode>MumbleSetVoiceChannel\u003c/code> to join a radio channel?","opts":["Nothing, it only creates the channel","They leave the Root channel, so normal proximity chat stops working for them","Everyone on the server hears them","They are muted"],"why":"The docs warn about this. pma-voice avoids it by using voice targets.","answer":1},{"q":"What is an audio submix used for?","opts":["Recording voice to a file","Applying effects such as a radio filter to a player's voice","Changing the player's microphone","Mixing NUI sounds"],"why":"Submixes route audio through effects like the radio FX shown in the docs.","answer":1}],"summary":"How FiveM voice works: Mumble proximity and submixes on Legacy, and the new server-owned voice channel API on FiveM for GTAV Enhanced."},{"id":"scaleform","group":"Scaleform","title":"Using Scaleform","mins":12,"docs":[{"label":"Using Scaleform","url":"https://docs.fivem.net/docs/scripting-manual/using-scaleform/"}],"sections":[{"title":"What Scaleform is","parts":[{"t":"html","h":"\u003cp>\u003cstrong>Scaleform GFx\u003c/strong> is the UI system GTA V itself uses for things like the \"WASTED\" screen, mission passed banners, the phone and instructional buttons. Each UI is a \"movie\" (a \u003ccode>.gfx\u003c/code> file) with functions you can call from your script. Using the built-in ones is easy; making your own requires Adobe Flash CS6 and ActionScript 2, which this lesson only mentions.\u003c/p>\n\u003cp>All Scaleform natives are client-side and live in the GRAPHICS namespace of the Native Reference.\u003c/p>"}]},{"title":"The four steps","parts":[{"t":"html","h":"\u003col>\u003cli>\u003cstrong>Load:\u003c/strong> \u003ccode>RequestScaleformMovie('name')\u003c/code> returns a handle. Loop on \u003ccode>HasScaleformMovieLoaded(handle)\u003c/code> until it is ready.\u003c/li>\u003cli>\u003cstrong>Call a function:\u003c/strong> \u003ccode>BeginScaleformMovieMethod(handle, 'FUNCTION_NAME')\u003c/code>, then add parameters, then \u003ccode>EndScaleformMovieMethod()\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Draw:\u003c/strong> call a draw native \u003cstrong>every frame\u003c/strong>, for as long as you want it visible.\u003c/li>\u003cli>\u003cstrong>Release:\u003c/strong> \u003ccode>SetScaleformMovieAsNoLongerNeeded(handle)\u003c/code> when you are done.\u003c/li>\u003c/ol>\n\u003cp>Parameter natives:\u003c/p>\n\u003cul>\u003cli>\u003ccode>ScaleformMovieMethodAddParamInt\u003c/code>, \u003ccode>ScaleformMovieMethodAddParamFloat\u003c/code>, \u003ccode>ScaleformMovieMethodAddParamBool\u003c/code>\u003c/li>\u003cli>\u003ccode>ScaleformMovieMethodAddParamTextureNameString\u003c/code> for \u003cstrong>short\u003c/strong> strings such as texture names\u003c/li>\u003cli>For normal text: \u003ccode>BeginTextCommandScaleformString('STRING')\u003c/code>, \u003ccode>AddTextComponentSubstringPlayerName(text)\u003c/code>, \u003ccode>EndTextCommandScaleformString()\u003c/code>\u003c/li>\u003c/ul>"}]},{"title":"Example: a big \"shard\" message","parts":[{"t":"html","h":"\u003cp>This shows the freemode big message for five seconds, based on the docs' example.\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"local function addText(text)\n    BeginTextCommandScaleformString('STRING')\n    AddTextComponentSubstringPlayerName(text)\n    EndTextCommandScaleformString()\nend\n\nlocal function showShard(title, subtitle, durationMs)\n    CreateThread(function()\n        local scaleform = RequestScaleformMovie('mp_big_message_freemode')\n        while not HasScaleformMovieLoaded(scaleform) do\n            Wait(0)\n        end\n\n        BeginScaleformMovieMethod(scaleform, 'SHOW_SHARD_WASTED_MP_MESSAGE')\n        addText(title)      -- big text\n        addText(subtitle)   -- smaller text\n        ScaleformMovieMethodAddParamInt(5) -- colour ID\n        EndScaleformMovieMethod()\n\n        local endTime = GetGameTimer() + durationMs\n        while GetGameTimer() \u003c endTime do\n            DrawScaleformMovieFullscreen(scaleform, 255, 255, 255, 255, 0)\n            Wait(0) -- draw every single frame\n        end\n\n        SetScaleformMovieAsNoLongerNeeded(scaleform)\n    end)\nend\n\nRegisterCommand('shard', function(source, args)\n    local title = args[1] or 'MISSION PASSED'\n    showShard(title, 'Respect +', 5000)\nend, false)"},{"t":"html","h":"\u003cp>The draw call has to run every frame because Scaleform is redrawn from scratch each frame, just like \u003ccode>DrawMarker\u003c/code>. The docs note the color and alpha arguments can be left at defaults since they do not affect anything.\u003c/p>"}]},{"title":"Drawing options","parts":[{"t":"html","h":"\u003cul>\u003cli>\u003ccode>DrawScaleformMovie\u003c/code> draws at a position and size on screen.\u003c/li>\u003cli>\u003ccode>DrawScaleformMovieFullscreen\u003c/code> fills the whole screen (most built-in movies are made for this).\u003c/li>\u003cli>\u003ccode>DRAW_SCALEFORM_MOVIE_3D\u003c/code> draws in the world. With blackout enabled it gets \"solarized\" yellow colours.\u003c/li>\u003cli>\u003ccode>DrawScaleformMovieFullscreenMasked\u003c/code> draws one movie masked by another (no anti-aliasing).\u003c/li>\u003c/ul>"}]}],"deeper":[{"title":"Making your own .gfx","parts":[{"t":"html","h":"\u003cul>\u003cli>You need \u003cstrong>Adobe Flash Pro CS6\u003c/strong>, \u003cstrong>ActionScript 2\u003c/strong> (AS3 is not supported) targeting Flash Player 8, and \u003ccode>gfxexport.exe\u003c/code> from the Scaleform GFx 4.0 SDK to convert \u003ccode>.swf\u003c/code> to \u003ccode>.gfx\u003c/code>.\u003c/li>\u003cli>Your movie must have a global \u003ccode>TIMELINE\u003c/code> variable; its members are the functions scripts can call.\u003c/li>\u003cli>Scaleform has no shape filters, no blur on text (fake it with glow), no real masking, and no embedded raster images. Load textures with the \u003ccode>img://txdName/textureName\u003c/code> protocol instead, for example \u003ccode>img://mpcarhud/albany\u003c/code>.\u003c/li>\u003cli>Some movies accept simple HTML such as \u003ccode>&lt;b&gt;\u003c/code>, \u003ccode>&lt;br&gt;\u003c/code> and font tags like \u003ccode>&lt;FONT FACE='$Font2'&gt;\u003c/code>.\u003c/li>\u003cli>The docs provide a boilerplate project to start from.\u003c/li>\u003c/ul>"}]}],"framework":[{"t":"html","h":"\u003cp>Frameworks rarely use Scaleform directly, but ox_lib and many HUDs use it for instructional buttons (the key hints in the bottom right). Big \"shard\" messages like the one above are a cheap way to add game-style feedback for job completions or events.\u003c/p>"}],"task":{"title":"Show a job-complete banner","parts":[{"t":"html","h":"\u003col>\u003cli>Add the \u003ccode>/shard\u003c/code> command to a test resource and try \u003ccode>/shard PAYDAY\u003c/code>.\u003c/li>\u003cli>Change the duration to 3 seconds and the subtitle to show a dollar amount.\u003c/li>\u003cli>Bonus: register a client event \u003ccode>myjob:complete\u003c/code> that calls \u003ccode>showShard\u003c/code>, and trigger it from a server command with \u003ccode>TriggerClientEvent\u003c/code>.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"Why do you loop on \u003ccode>HasScaleformMovieLoaded\u003c/code> after requesting the movie?","opts":["To make it fade in","Because the movie loads asynchronously and cannot be used until it is ready","Because you must request it every frame","To check the player owns it"],"why":"Like models, Scaleform movies load in the background. Using one before it is loaded does nothing.","answer":1},{"q":"How often do you call \u003ccode>DrawScaleformMovieFullscreen\u003c/code>?","opts":["Once, right after EndScaleformMovieMethod","Every frame, for as long as it should be visible","Once per second","Only when the screen size changes"],"why":"Scaleform is drawn per frame, so it sits inside a loop with Wait(0).","answer":1},{"q":"How should you pass a normal sentence of text as a Scaleform parameter?","opts":["ScaleformMovieMethodAddParamInt","ScaleformMovieMethodAddParamTextureNameString","BeginTextCommandScaleformString, AddTextComponentSubstringPlayerName, EndTextCommandScaleformString","SendNUIMessage"],"why":"The texture-name string native is only for short strings like texture names; text commands handle normal text.","answer":2}],"summary":"Scaleform is GTA's own Flash-based UI. Load a movie, call its functions, and draw it every frame to show big game-style messages."},{"id":"migrating","group":"Migrating","title":"Migrating from deprecated methods","mins":10,"docs":[{"label":"Migrating from deprecated methods","url":"https://docs.fivem.net/docs/scripting-manual/migrating-from-deprecated/"},{"label":"Chat messages","url":"https://docs.fivem.net/docs/scripting-manual/migrating-from-deprecated/chat-messages/"},{"label":"Creating commands","url":"https://docs.fivem.net/docs/scripting-manual/migrating-from-deprecated/creating-commands/"}],"sections":[{"title":"Chat messages: chatMessage to chat:addMessage","parts":[{"t":"html","h":"\u003cp>The old \u003ccode>chatMessage\u003c/code> event took three separate values: author, color and text. It is deprecated. The \u003ccode>chat:addMessage\u003c/code> event takes one table with \u003ccode>color\u003c/code>, \u003ccode>multiline\u003c/code> and \u003ccode>args\u003c/code>.\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"-- OLD (deprecated)\nTriggerEvent('chatMessage', GetPlayerName(PlayerId()), { 255, 255, 255 }, 'Hello!')\n\n-- NEW\nTriggerEvent('chat:addMessage', {\n    color = { 255, 255, 255 },\n    multiline = true,\n    args = { GetPlayerName(PlayerId()), 'Hello!' }\n})"},{"t":"html","h":"\u003cp>From the server, send it to one player with \u003ccode>TriggerClientEvent('chat:addMessage', playerId, {...})\u003c/code> or to everyone with \u003ccode>-1\u003c/code>.\u003c/p>"}]},{"title":"Commands: chat parsing to RegisterCommand","parts":[{"t":"html","h":"\u003cp>Old scripts listened to every chat message, checked if it started with \u003ccode>/\u003c/code>, and split the text themselves. The docs say to \u003cstrong>always\u003c/strong> use \u003ccode>RegisterCommand\u003c/code> instead: it works from chat and the console, supports auto-completion, and plugs into the ACE permission system.\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"RegisterCommand('commandName', function(source, args, rawCommand)\n    if source > 0 then\n        print('Run by player ' .. source)\n    else\n        print('Run from the server console')\n    end\nend, true) -- true = restricted: needs the 'command.commandName' ACE"},{"t":"html","h":"\u003cp>Give the permission in \u003ccode>server.cfg\u003c/code>:\u003c/p>"},{"t":"code","lang":"cfg","file":"server.cfg","code":"add_ace group.admin command.commandName allow"},{"t":"html","h":"\u003cp>You can also show players a hint while they type. The \u003ccode>chat\u003c/code> resource listens for \u003ccode>chat:addSuggestion\u003c/code> on the client:\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"TriggerEvent('chat:addSuggestion', '/car', 'Spawn a vehicle', {\n    { name = 'model', help = 'Vehicle model name, e.g. adder' }\n})"}]},{"title":"Other modern replacements","parts":[{"t":"html","h":"\u003cp>These patterns are not deprecated warnings in the docs, but the docs' own current examples use the newer form. Updating them makes scripts easier to read.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>You will see\u003c/th>\u003cth>Modern equivalent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>__resource.lua\u003c/code> with \u003ccode>resource_manifest_version\u003c/code>\u003c/td>\u003ctd>\u003ccode>fxmanifest.lua\u003c/code> with \u003ccode>fx_version 'cerulean'\u003c/code> and \u003ccode>game 'gta5'\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>RegisterServerEvent('x')\u003c/code> + \u003ccode>AddEventHandler('x', fn)\u003c/code>\u003c/td>\u003ctd>\u003ccode>RegisterNetEvent('x', fn)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Citizen.CreateThread\u003c/code> / \u003ccode>Citizen.Wait\u003c/code>\u003c/td>\u003ctd>\u003ccode>CreateThread\u003c/code> / \u003ccode>Wait\u003c/code> (same functions, shorter names)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GetPlayerPed(-1)\u003c/code> on the client\u003c/td>\u003ctd>\u003ccode>PlayerPedId()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>GetDistanceBetweenCoords(x1, y1, z1, x2, y2, z2, true)\u003c/code>\u003c/td>\u003ctd>\u003ccode>#(vector3(...) - vector3(...))\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lua54 'yes'\u003c/code> in the manifest\u003c/td>\u003ctd>Not needed: all Lua runs on 5.4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nui://resource/file\u003c/code> in NUI pages\u003c/td>\u003ctd>\u003ccode>https://cfx-nui-resource/file\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"code","lang":"lua","file":"server.lua","code":"-- OLD\nRegisterServerEvent('shop:buy')\nAddEventHandler('shop:buy', function(item)\n    -- ...\nend)\n\n-- NEW\nRegisterNetEvent('shop:buy', function(item)\n    -- ...\nend)"},{"t":"code","lang":"lua","file":"client.lua","code":"-- OLD\nCitizen.CreateThread(function()\n    while true do\n        Citizen.Wait(0)\n        local coords = GetEntityCoords(GetPlayerPed(-1))\n        if GetDistanceBetweenCoords(coords.x, coords.y, coords.z, 25.7, -1347.3, 29.5, true) \u003c 2.0 then\n            -- ...\n        end\n    end\nend)\n\n-- NEW\nlocal shop = vector3(25.7, -1347.3, 29.5)\nCreateThread(function()\n    while true do\n        local coords = GetEntityCoords(PlayerPedId())\n        if #(coords - shop) \u003c 2.0 then\n            -- ...\n        end\n        Wait(0)\n    end\nend)"}]}],"deeper":[{"title":"Migrating from other platforms","parts":[{"t":"html","h":"\u003cp>The docs also have a guide for people coming from other GTA V multiplayer platforms. The main ideas carry over: FiveM's events replace their remote calls, natives are called directly instead of through wrapper objects, and the server only trusts what it checks itself.\u003c/p>"}]}],"framework":[{"t":"html","h":"\u003cp>Older ESX scripts are the most common source of these patterns (for example \u003ccode>TriggerEvent('esx:getSharedObject', function(obj) ESX = obj end)\u003c/code>). Current ESX uses \u003ccode>ESX = exports['es_extended']:getSharedObject()\u003c/code> or the \u003ccode>@es_extended/imports.lua\u003c/code> shared script. Current QBCore uses \u003ccode>exports['qb-core']:GetCoreObject()\u003c/code>.\u003c/p>"}],"task":{"title":"Modernize an old script","parts":[{"t":"html","h":"\u003col>\u003cli>Pick a small, simple script on your server (back it up first).\u003c/li>\u003cli>Search it for \u003ccode>chatMessage\u003c/code>, \u003ccode>RegisterServerEvent\u003c/code>, \u003ccode>Citizen.Wait\u003c/code>, \u003ccode>GetPlayerPed(-1)\u003c/code> and \u003ccode>GetDistanceBetweenCoords\u003c/code>.\u003c/li>\u003cli>Replace each with the modern form from this lesson.\u003c/li>\u003cli>\u003ccode>restart\u003c/code> it and test that it still works exactly as before.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"What should replace \u003ccode>TriggerEvent('chatMessage', 'Bob', {255,0,0}, 'Hi')\u003c/code>?","opts":["TriggerEvent('chat:message', 'Bob', 'Hi')","TriggerEvent('chat:addMessage', { color = {255,0,0}, args = {'Bob', 'Hi'} })","print('Bob: Hi')","SendNUIMessage({ text = 'Hi' })"],"why":"chat:addMessage takes one table with color, multiline and args.","answer":1},{"q":"A \u003ccode>RegisterCommand\u003c/code> call ends with \u003ccode>true\u003c/code>. What does that do?","opts":["Shows the command in chat suggestions","Restricts it to players with the matching command.name ACE","Makes it client-only","Logs every use"],"why":"The restricted flag ties the command into the ACL system: players need the \u003ccode>command.&lt;name&gt;\u003c/code> ACE.","answer":1},{"q":"Which is the modern way to register a server event from clients?","opts":["RegisterServerEvent('x') then AddEventHandler('x', fn)","RegisterNetEvent('x', function(...) end)","AddEventHandler('x', fn) on the client","RegisterCommand('x', fn)"],"why":"RegisterNetEvent with a handler registers and listens in one call.","answer":1}],"summary":"Old tutorials are full of outdated patterns. Learn to spot them and replace them with the modern methods this course uses."},{"id":"game-features","group":"New features","title":"Using new game features","mins":12,"docs":[{"label":"Using new game features","url":"https://docs.fivem.net/docs/scripting-manual/using-new-game-features/"},{"label":"Fuel consumption","url":"https://docs.fivem.net/docs/scripting-manual/using-new-game-features/fuel-consumption/"},{"label":"Collection-based natives","url":"https://docs.fivem.net/docs/scripting-manual/using-new-game-features/collection-based-natives/"}],"sections":[{"title":"Fuel consumption","parts":[{"t":"html","h":"\u003cp>In GTA V vehicles never use fuel. FiveM lets you switch real consumption on with \u003ccode>SetFuelConsumptionState(true)\u003c/code> (client), and check it with \u003ccode>GetFuelConsumptionState()\u003c/code>.\u003c/p>\n\u003cp>When on, fuel burns at:\u003c/p>"},{"t":"code","lang":"text","file":"formula","code":"time_step * rpm * vehicle_fuel_consumption_rate_multiplier * global_fuel_consumption_rate_multiplier"},{"t":"html","h":"\u003cp>So higher revs burn more fuel, and an engine that is off burns none. A 65 litre car with average consumption lasts about 16.67 hours idling or about 2.5 hours at max RPM.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Global rate:\u003c/strong> \u003ccode>SetFuelConsumptionRateMultiplier(value)\u003c/code> (default 1, negatives become 0).\u003c/li>\u003cli>\u003cstrong>Per vehicle:\u003c/strong> handling field \u003ccode>fPetrolConsumptionRate\u003c/code> (default 0.5) via \u003ccode>SetVehicleHandlingFloat\u003c/code> or \u003ccode>handling.meta\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Tank size:\u003c/strong> handling field \u003ccode>fPetrolTankVolume\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Current fuel:\u003c/strong> \u003ccode>GetVehicleFuelLevel\u003c/code> / \u003ccode>SetVehicleFuelLevel\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>Fuel is not used by NPC-only vehicles, bicycles, or vehicles with a tank volume of 0. \u003ccode>DoesVehicleUseFuel(vehicle)\u003c/code> tells you if a vehicle will consume fuel.\u003c/p>"}]},{"title":"Example: a simple refuel point","parts":[{"t":"html","h":"\u003cp>FiveM does not include gas stations, so you build them. This is a trimmed version of the docs' example. Note it only shows help text when you are at the station, and it sleeps when you are not in a car.\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"local stations = {\n    { coords = vector3(64.55, 20.4, 68.9), radius = 8.0 },\n}\n\nAddTextEntry('FUEL_HELP', 'Press ~INPUT_VEH_HEADLIGHT~ to fill the tank.')\n\nlocal function atStation(coords)\n    for _, station in ipairs(stations) do\n        if #(coords - station.coords) \u003c= station.radius then\n            return true\n        end\n    end\n    return false\nend\n\nCreateThread(function()\n    SetFuelConsumptionState(true)\n\n    while true do\n        local sleep = 1000\n        local vehicle = GetVehiclePedIsIn(PlayerPedId(), false)\n\n        if vehicle ~= 0 and DoesVehicleUseFuel(vehicle) and atStation(GetEntityCoords(vehicle)) then\n            sleep = 0\n            BeginTextCommandDisplayHelp('FUEL_HELP')\n            EndTextCommandDisplayHelp(0, false, false, -1)\n\n            if IsControlJustPressed(0, 74) then -- 74 = H (vehicle headlight)\n                local tank = GetVehicleHandlingFloat(vehicle, 'CHandlingData', 'fPetrolTankVolume')\n                SetVehicleFuelLevel(vehicle, tank)\n            end\n        end\n\n        Wait(sleep)\n    end\nend)"},{"t":"html","h":"\u003cdiv class=\"callout\">\u003cspan class=\"callout-tag\">note\u003c/span>\u003cp>On a real RP server, refuelling should cost money, which means the client asks the server, the server checks the player is at a station and takes the money, then tells the client to fill up. See the security lesson.\u003c/p>\u003c/div>"}]},{"title":"Clothing collections","parts":[{"t":"html","h":"\u003cp>Ped clothes (\"drawables\") and props used to be addressed by a \u003cstrong>global index\u003c/strong>. Every GTA title update adds new DLC clothing \u003cem>before\u003c/em> custom clothing, so all custom indexes shift and outfits break. The new \u003cstrong>collection-based natives\u003c/strong> address clothes by \u003cstrong>collection name + local index\u003c/strong>, which stays the same across updates. They are client-only.\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"local function setLook(ped)\n    -- head (component 0) from the base game collection (''), local index 27\n    SetPedCollectionComponentVariation(ped, 0, '', 27, 0, 0)\n\n    -- pants (component 4) from the heist DLC collection, local index 9, texture 3\n    SetPedCollectionComponentVariation(ped, 4, 'female_heist', 9, 3, 0)\n\n    -- hat (anchor point 0) from the biker DLC collection\n    SetPedCollectionPropIndex(ped, 0, 'mp_f_bikerdlc_01', 0, 0, false)\nend\n\nRegisterCommand('pantsinfo', function()\n    local ped = PlayerPedId()\n    local collection = GetPedDrawableVariationCollectionName(ped, 4)\n    local localIndex = GetPedDrawableVariationCollectionLocalIndex(ped, 4)\n    print(('Pants: collection \"%s\", local index %d'):format(collection, localIndex))\nend, false)"},{"t":"html","h":"\u003cp>Collection names come from the \u003ccode>&lt;CPedVariationInfo name=\"...\"&gt;\u003c/code> tag in each clothing pack's \u003ccode>.ymt\u003c/code> file. The base game collection's name is an empty string.\u003c/p>"}]}],"deeper":[{"title":"Collection natives at a glance","parts":[{"t":"html","h":"\u003cul>\u003cli>Info: \u003ccode>GetPedCollectionsCount\u003c/code>, \u003ccode>GetPedCollectionName\u003c/code>\u003c/li>\u003cli>Convert global to local: \u003ccode>GetPedCollectionNameFromDrawable\u003c/code>, \u003ccode>GetPedCollectionLocalIndexFromDrawable\u003c/code> (and the \u003ccode>...FromProp\u003c/code> versions)\u003c/li>\u003cli>Convert local to global: \u003ccode>GetPedDrawableGlobalIndexFromCollection\u003c/code>, \u003ccode>GetPedPropGlobalIndexFromCollection\u003c/code>\u003c/li>\u003cli>Replacements: \u003ccode>SetPedComponentVariation\u003c/code> becomes \u003ccode>SetPedCollectionComponentVariation\u003c/code>, \u003ccode>SetPedPropIndex\u003c/code> becomes \u003ccode>SetPedCollectionPropIndex\u003c/code>, \u003ccode>GetNumberOfPedDrawableVariations\u003c/code> becomes \u003ccode>GetNumberOfPedCollectionDrawableVariations\u003c/code>, and so on.\u003c/li>\u003c/ul>"}]}],"framework":[{"t":"html","h":"\u003cp>Fuel resources such as LegacyFuel or ox_fuel manage fuel themselves, so do not turn on \u003ccode>SetFuelConsumptionState\u003c/code> alongside one without checking how it works. Clothing menus (illenium-appearance, qb-clothing) still mostly save global indexes; if your outfits shuffle after a game update, collection-based saving is the long-term fix.\u003c/p>"}],"task":{"title":"Check your fuel","parts":[{"t":"html","h":"\u003col>\u003cli>Write a client command \u003ccode>/fuel\u003c/code> that prints \u003ccode>GetVehicleFuelLevel\u003c/code> and the \u003ccode>fPetrolTankVolume\u003c/code> of the car you are in.\u003c/li>\u003cli>On a test server without a fuel resource, call \u003ccode>SetFuelConsumptionState(true)\u003c/code> and drive at high revs, running \u003ccode>/fuel\u003c/code> now and then.\u003c/li>\u003cli>Run \u003ccode>/pantsinfo\u003c/code> and note your pants' collection name and local index.\u003c/li>\u003c/ol>"}]},"quiz":[{"q":"Why do custom clothing indexes break after a GTA title update?","opts":["Rockstar deletes custom clothing","New official DLC collections are inserted before custom ones, shifting their global indexes","FiveM resets all ped variations","The .ymt files expire"],"why":"Global indexes count from the start of all collections. Collection name + local index stays stable.","answer":1},{"q":"When fuel consumption is on, when does a vehicle use no fuel?","opts":["When it is moving downhill","When the engine is off, it is a bicycle, or only NPCs are in it","When the player is in first person","Never, all vehicles use fuel"],"why":"The docs list engine off, NPC-only vehicles, bicycles and tank volume 0 as exceptions.","answer":1},{"q":"Which native turns fuel consumption on?","opts":["SetVehicleFuelLevel(vehicle, 100.0)","SetFuelConsumptionState(true)","SetFuelConsumptionRateMultiplier(1.0)","DoesVehicleUseFuel(vehicle)"],"why":"SetFuelConsumptionState toggles the feature; the rate multiplier only changes how fast fuel burns.","answer":1}],"summary":"FiveM adds features the base game never had: real fuel consumption, and clothing natives that do not break when GTA updates."},{"id":"security","group":"Security","title":"Secure your events and spot backdoors","mins":22,"docs":[{"label":"Secure Your Events","url":"https://docs.fivem.net/docs/developers/server-security/"},{"label":"Listening for events","url":"https://docs.fivem.net/docs/scripting-manual/working-with-events/listening-for-events/"},{"label":"Example secure resources (linked from the docs)","url":"https://github.com/TheIndra55/secure-resource-examples"}],"sections":[{"title":"Assume every client is lying","parts":[{"t":"html","h":"\u003cp>Cheats let a player trigger events in any context: \u003cstrong>client to server\u003c/strong> (\u003ccode>TriggerServerEvent\u003c/code>) and \u003cstrong>one client resource to another\u003c/strong> (\u003ccode>TriggerEvent\u003c/code>). They can send any values they like, as often as they like. The anti-cheat catches a lot, but the docs are clear: your own server-side checks are what keep your economy safe.\u003c/p>\n\u003cp>So for every network event, ask: \u003cem>if a cheater sent this event right now, with the worst possible values, what happens?\u003c/em>\u003c/p>"}]},{"title":"Register only what needs to be networked","parts":[{"t":"html","h":"\u003cul>\u003cli>Use \u003ccode>AddEventHandler\u003c/code> for events that only your own side triggers (server to server, client to client). They cannot be called from the other side.\u003c/li>\u003cli>Use \u003ccode>RegisterNetEvent\u003c/code> only for events the other side really needs to call.\u003c/li>\u003c/ul>\n\u003cp>A server event that is only meant to be called by other server scripts should \u003cstrong>not\u003c/strong> be a net event. If it is, a cheater can call it directly.\u003c/p>\n\u003cp>On the client, events sent by the server arrive with \u003ccode>source\u003c/code> set to \u003ccode>65535\u003c/code>. You can use that to refuse calls from other client resources (this is not bullet proof; anything on the client can be modified):\u003c/p>"},{"t":"code","lang":"lua","file":"client.lua","code":"RegisterNetEvent('myjob:client:startJob', function(jobData)\n    -- server-sent events have source 65535; ignore anything else\n    if source ~= 65535 then return end\n    -- ...\nend)"}]},{"title":"Bad: trusting the client","parts":[{"t":"code","lang":"lua","file":"server.lua","code":"-- NEVER DO THIS\nRegisterNetEvent('shop:buy', function(item, count, price)\n    local src = source\n    -- the client chose the item, the amount AND the price\n    exports.myframework:RemoveMoney(src, price)\n    exports.myframework:AddItem(src, item, count)\nend)"},{"t":"html","h":"\u003cp>A cheater can call \u003ccode>TriggerServerEvent('shop:buy', 'weapon_rpg', 100, 0)\u003c/code> and get 100 rocket launchers for free. (The \u003ccode>exports.myframework\u003c/code> calls are placeholders for your framework.)\u003c/p>"}]},{"title":"Good: the server decides","parts":[{"t":"html","h":"\u003cp>The fix: the client only says \u003cstrong>what it wants\u003c/strong>. The server looks up the price itself, checks the values, checks where the player is, rate-limits, and only then acts.\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"local SHOP_COORDS = vector3(25.7, -1347.3, 29.5)\nlocal MAX_DISTANCE = 5.0\n\n-- prices live on the server, never in the event\nlocal ITEMS = {\n    water = { price = 5 },\n    sandwich = { price = 8 },\n}\n\nlocal lastPurchase = {}\n\nRegisterNetEvent('shop:buy', function(itemName, count)\n    local src = source\n\n    -- 1. validate types and ranges\n    if type(itemName) ~= 'string' or type(count) ~= 'number' then return end\n    count = math.floor(count)\n    if count \u003c 1 or count > 10 then return end\n\n    -- 2. whitelist: only items this shop sells\n    local item = ITEMS[itemName]\n    if not item then return end\n\n    -- 3. distance: is the player actually at the shop? (server-side position)\n    local ped = GetPlayerPed(src)\n    if #(GetEntityCoords(ped) - SHOP_COORDS) > MAX_DISTANCE then return end\n\n    -- 4. cooldown: at most one purchase per second\n    local now = GetGameTimer()\n    if lastPurchase[src] and now - lastPurchase[src] \u003c 1000 then return end\n    lastPurchase[src] = now\n\n    -- 5. act, using values the server computed\n    local total = item.price * count\n    -- if exports.myframework:RemoveMoney(src, total) then\n    --     exports.myframework:AddItem(src, itemName, count)\n    -- end\n    print(('%s bought %dx %s for $%d'):format(GetPlayerName(src), count, itemName, total))\nend)\n\nAddEventHandler('playerDropped', function()\n    lastPurchase[source] = nil\nend)"},{"t":"html","h":"\u003cp>Things to check on network events, from the docs: player \u003cstrong>money\u003c/strong>, \u003cstrong>state bags\u003c/strong>, \u003cstrong>inventory items\u003c/strong>, \u003cstrong>position\u003c/strong>, \u003cstrong>experience/level\u003c/strong> and \u003cstrong>permissions/roles\u003c/strong>. Always read these with server-side methods, never from values the client sent.\u003c/p>"}]},{"title":"Server-owned job state","parts":[{"t":"html","h":"\u003cp>For jobs, keep track of who is actually doing the job \u003cstrong>on the server\u003c/strong>, and pay out from that record. This is the docs' job pattern, with two small bugs from the original page fixed (the loop now uses its own \u003ccode>src\u003c/code>, and the turn-in handler gets the ped before using it).\u003c/p>"},{"t":"code","lang":"lua","file":"server.lua","code":"local JOB_COORDS = vector3(125.0, 111.1, 35.83)\nlocal TURNIN_COORDS = vector3(1888.0, 1254.1, 48.0)\nlocal MAX_ITEMS = 10\n\nlocal activeJobs = {} -- [serverId] = { itemCount = number }\n\nlocal function isNear(src, coords)\n    return #(GetEntityCoords(GetPlayerPed(src)) - coords) \u003c 15.0\nend\n\nAddEventHandler('playerDropped', function()\n    activeJobs[source] = nil\nend)\n\n-- the server counts progress once per second, only while the player is at the job site\nCreateThread(function()\n    while true do\n        for src, data in pairs(activeJobs) do\n            if isNear(src, JOB_COORDS) then\n                data.itemCount = math.min(data.itemCount + 1, MAX_ITEMS)\n            end\n        end\n        Wait(1000)\n    end\nend)\n\nRegisterNetEvent('job:startJob', function()\n    local src = source\n    if isNear(src, JOB_COORDS) then\n        activeJobs[src] = { itemCount = 0 }\n    end\nend)\n\nRegisterNetEvent('job:turnIn', function()\n    local src = source\n    local job = activeJobs[src]\n    if not job then return end                       -- never started: reject\n    if not isNear(src, TURNIN_COORDS) then return end -- not at the turn-in point: reject\n\n    activeJobs[src] = nil -- reset first so it cannot be triggered twice\n    -- exports.myframework:AddItem(src, 'log', job.itemCount)\n    print(('%s turned in %d logs'):format(GetPlayerName(src), job.itemCount))\nend)"},{"t":"html","h":"\u003cp>Notice the client never says how many logs it has. It just says \"I'm done\", and the server pays out what \u003cem>it\u003c/em> counted.\u003c/p>"}]},{"title":"ACE permissions for admin actions","parts":[{"t":"html","h":"\u003cp>Admin commands and events must check permissions on the server. FiveM's built-in system is \u003cstrong>ACE\u003c/strong> (access control entries) with \u003cstrong>principals\u003c/strong> (groups and identifiers).\u003c/p>"},{"t":"code","lang":"cfg","file":"server.cfg","code":"# give a group permission to a custom ACE\nadd_ace group.admin myresource.admin allow\n\n# put a player (by license) into that group\nadd_principal identifier.license:abc123yourlicensehere group.admin"},{"t":"code","lang":"lua","file":"server.lua","code":"-- restricted command: needs the command.heal ACE automatically\nRegisterCommand('heal', function(source, args)\n    -- ...\nend, true)\n\n-- custom check, for events and anything that is not a command\nRegisterNetEvent('admin:teleportTo', function(targetId)\n    local src = source\n    if not IsPlayerAceAllowed(src, 'myresource.admin') then\n        print(('%s tried an admin event without permission'):format(GetPlayerName(src)))\n        return\n    end\n    -- ...\nend)"},{"t":"html","h":"\u003cp>The client can hide or show admin buttons for convenience, but the \u003cstrong>server check is the only one that counts\u003c/strong>.\u003c/p>"}]},{"title":"Checklist for every server event","parts":[{"t":"html","h":"\u003cul>\u003cli>Is it a net event only because it needs to be?\u003c/li>\u003cli>Did I copy \u003ccode>local src = source\u003c/code> and use \u003ccode>src\u003c/code>, never a player ID sent by the client?\u003c/li>\u003cli>Are all arguments the right \u003cstrong>type\u003c/strong>, in a sane \u003cstrong>range\u003c/strong>, and on a \u003cstrong>whitelist\u003c/strong>?\u003c/li>\u003cli>Are prices, rewards and amounts decided by the \u003cstrong>server\u003c/strong>?\u003c/li>\u003cli>Is the player \u003cstrong>near\u003c/strong> where this action happens (server-side coords)?\u003c/li>\u003cli>Is there a \u003cstrong>cooldown\u003c/strong> or one-time flag so it cannot be spammed?\u003c/li>\u003cli>Do admin actions check \u003cstrong>IsPlayerAceAllowed\u003c/strong>?\u003c/li>\u003cli>Do I clean up per-player tables in \u003cstrong>playerDropped\u003c/strong>?\u003c/li>\u003c/ul>"}]},{"title":
